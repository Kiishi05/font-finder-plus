<style>
/* Layout: a browser window beside the 400px panel. Simple: one switch, one list, one size control. Same tokens as the redesigned extension. */
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --line: rgba(255,255,255,0.08); --field: #262626; --field-2: #333333; --inset: #212121; --free: #6be29c; --free-dot: #3ad47a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --desk: #050505; --bg: #0d0d0d; --sheet: #171717; --ink: #f2f2f2; --ink-2: #a3a3a3; --ink-3: #969696;
  --line: rgba(255,255,255,0.08); --field: #262626; --field-2: #333333; --inset: #212121; --free: #6be29c; --free-dot: #3ad47a; color-scheme: dark; }
* { box-sizing: border-box; }

button { font: inherit; color: inherit; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.steps { display: flex; gap: 2px; padding: 4px; background: var(--sheet); border-radius: 14px; align-self: flex-start; }
.steps button { height: 34px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); font-weight: 500; cursor: pointer; }

.browser { background: var(--sheet); border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); min-width: 0; }

.viewport { height: 640px; overflow: hidden; }
/* The mock website. Its type is driven by role variables. */

  --h2-f: 'Inter'; --h2-s: 26px; --h2-w: 600; --h2-lh: 1.2; --h2-t: -0.01em;
  --b-f: 'Inter'; --b-s: 16px; --b-w: 400; --b-lh: 1.55;
  --l-f: 'Inter'; --l-s: 14px; --l-w: 500; --l-t: 0;
  height: 100%; background: #fbfaf7; color: #1d1b16; overflow: hidden; }

/* Panel */
.panel { display: flex; flex-direction: column; gap: 8px; }
.box { background: var(--sheet); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }

.fh .grow { flex: 1; }

.site[data-hl="h1"] .s-h1, .site[data-hl="h2"] .s-h2, .site[data-hl="body"] :is(.s-body, .s-lede), .site[data-hl="label"] :is(.s-btn, .s-nav a, .s-label) { outline: 2px solid #3b5bdb; outline-offset: 3px; border-radius: 4px; }

.fb-btn { width: 34px; height: 34px; border: 0; border-radius: 10px; background: transparent; color: #f2f2f2; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; position: relative; }
.fb-btn:hover { background: rgba(255,255,255,0.1); }
.wrap { padding-block-end: 90px; }
/* The picker (harness chrome, verbatim spec) */
.proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
.proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); }

/* Figma plugin window, as in the plugin prototype */
.pwin { background: var(--bg); border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,0.16); display: flex; flex-direction: column; min-height: 600px; }

.phead { display: flex; align-items: center; gap: 8px; padding: 2px 2px 4px; }
.pback { width: 36px; height: 36px; border: 0; border-radius: 12px; background: var(--sheet); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }

.rolebtn:disabled { color: var(--ink-3); cursor: default; }

.rmenu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 10; min-width: 180px; margin: 0; padding: 4px; list-style: none; background: var(--sheet); border-radius: 12px; box-shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(0,0,0,0.14); }
