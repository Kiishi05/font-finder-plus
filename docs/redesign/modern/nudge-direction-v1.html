<!doctype html>
<html lang="en" data-theme="light" data-primary="cobalt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nudge Direction v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Tokens. Nudge's structure (flat panel, wells, one brand colour) with a
   COOL neutral scale instead of Nudge's warm stone greys.
   Type scale: 12 / 13 / 14 / 16 / 20, weights 400 and 600 only.
   ===================================================================== */
:root {
  --canvas: #EEF0F3; --panel: #ffffff; --panel-2: #F5F6F8; --raised: #FAFBFC; --btn-on: #ffffff;
  --well: rgba(15,23,42,.045); --well-2: rgba(15,23,42,.085); --hover: rgba(15,23,42,.035);
  --text: #1C2024; --text-2: #60646C; --text-3: #8B8D98;
  --line: rgba(15,23,42,.08);
  --lift: 0 1px 2px rgba(15,23,42,.08), 0 1px 1px rgba(15,23,42,.04);
  --pop: 0 0 0 1px rgba(15,23,42,.05), 0 4px 16px rgba(15,23,42,.10);
  --free: #0b7a37; --free-dot: #19a35a; --paid: #8a5a00; --paid-dot: #E39B12; --red: #D4332A;
  --chrome: #F0F1F4; --chrome-line: rgba(15,23,42,.07);
  --ui: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --r4: 4px; --r8: 8px; --r12: 12px; --r16: 16px; --r24: 24px;
  /* sizes: buttons and value fields 36px (Nudge), text inputs 40px, 44px for everything on touch */
  --ctl: 36px; --inp: 40px; --ib: 34px;
  --fs-xs: 12px; --lh-xs: 16px; --fs-sm: 13px; --lh-sm: 20px; --fs-md: 14px; --lh-md: 20px; --fs-lg: 16px; --lh-lg: 24px; --fs-xl: 20px; --lh-xl: 28px;
  --w-reg: 400; --w-bold: 600;
}
@media (pointer: coarse) { :root { --ctl: 44px; --inp: 44px; --ib: 44px; } }
html[data-theme="dark"] {
  --canvas: #0B0B0D; --panel: #111113; --panel-2: #18191B; --raised: #18191B; --btn-on: #2A2B2F;
  --well: rgba(255,255,255,.06); --well-2: rgba(255,255,255,.11); --hover: rgba(255,255,255,.04);
  --text: #EDEEF0; --text-2: #B0B4BA; --text-3: #777B84;
  --line: rgba(255,255,255,.08);
  --lift: 0 0 #0000;
  --pop: 0 0 0 1px rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.5);
  --free: #4cc884; --free-dot: #3ad47a; --paid: #f0b44c;
  --chrome: #18191B; --chrome-line: rgba(255,255,255,.06);
  color-scheme: dark;
}
/* primary colour: --p fill, --p-hover, --p-text (links, active text), --p-soft tint, --on-p text on fill */
html[data-primary="orange"] { --p: #C9480E; --p-hover: #B33C0B; --p-text: #B33C0B; --p-soft: rgba(201,72,14,.09); --p-soft-2: rgba(201,72,14,.15); --on-p: #fff; --ring: #C9480E; --dock-on: #C9480E; }
html[data-primary="cobalt"] { --p: #2B63F5; --p-hover: #2457E0; --p-text: #2457E0; --p-soft: rgba(43,99,245,.08); --p-soft-2: rgba(43,99,245,.14); --on-p: #fff; --ring: #2B63F5; --dock-on: #2B63F5; }
html[data-primary="violet"] { --p: #6E56CF; --p-hover: #5A43B8; --p-text: #5A43B8; --p-soft: rgba(110,86,207,.09); --p-soft-2: rgba(110,86,207,.15); --on-p: #fff; --ring: #6E56CF; --dock-on: #6E56CF; }
html[data-primary="ink"] { --p: #1C2024; --p-hover: #33383F; --p-text: #1C2024; --p-soft: rgba(15,23,42,.06); --p-soft-2: rgba(15,23,42,.10); --on-p: #fff; --ring: #1C2024; --dock-on: rgba(255,255,255,.2); }
html[data-theme="dark"][data-primary="orange"] { --p-text: #FF8257; --p-soft: rgba(255,130,87,.12); --p-soft-2: rgba(255,130,87,.2); --ring: #FF8257; }
html[data-theme="dark"][data-primary="cobalt"] { --p-text: #7B9DFF; --p-soft: rgba(123,157,255,.12); --p-soft-2: rgba(123,157,255,.2); --ring: #7B9DFF; }
html[data-theme="dark"][data-primary="violet"] { --p-text: #A996F2; --p-soft: rgba(169,150,242,.12); --p-soft-2: rgba(169,150,242,.2); --ring: #A996F2; }
html[data-theme="dark"][data-primary="ink"] { --p: #EDEEF0; --p-hover: #ffffff; --p-text: #EDEEF0; --p-soft: rgba(255,255,255,.08); --p-soft-2: rgba(255,255,255,.13); --on-p: #111113; --ring: #EDEEF0; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--canvas); color: var(--text); font: var(--w-reg) var(--fs-sm)/var(--lh-sm) var(--ui); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; overflow-x: hidden; }
button, input { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; }
button { cursor: pointer; text-align: inherit; }
svg { display: block; flex: none; }
b, strong { font-weight: var(--w-bold); }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
input:focus-visible { outline: none; }
.well:focus-within { box-shadow: 0 0 0 2px var(--ring); }

/* ---------- type roles ---------- */
.t-xl { font-size: var(--fs-xl); line-height: var(--lh-xl); font-weight: var(--w-bold); letter-spacing: -.015em; }
.t-lg { font-size: var(--fs-lg); line-height: var(--lh-lg); font-weight: var(--w-bold); letter-spacing: -.01em; }
.t-md { font-size: var(--fs-md); line-height: var(--lh-md); font-weight: var(--w-bold); letter-spacing: -.005em; }
.t-xs { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-2); }

/* ============ comparison strip: the primary colour picker ============ */
.strip { position: relative; z-index: 60; padding: 16px 24px 16px; background: var(--panel); display: flex; flex-direction: column; gap: 12px; }
.strip .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.strip h1 { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: 1; min-width: 220px; }
.strip h1 span.v { font-weight: var(--w-reg); color: var(--text-2); }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 10px; background: var(--well); }
.seg button { height: 32px; padding: 0 12px; border-radius: var(--r8); font-weight: var(--w-bold); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--btn-on); color: var(--text); box-shadow: var(--lift); }
@media (pointer: coarse) { .seg button { height: 40px; } }
.prims { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.prim { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: var(--r12); background: var(--well); text-align: left; min-width: 0; }
.prim:hover { background: var(--well-2); }
.prim[aria-pressed="true"] { background: var(--btn-on); box-shadow: 0 0 0 2px var(--sw), var(--lift); }
html[data-theme="dark"] .prim .sw, html[data-theme="dark"] .logo { box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.prim .sw { width: 32px; height: 32px; border-radius: var(--r8); flex: none; display: grid; place-items: center; color: #fff; font: var(--w-bold) var(--fs-xs)/1 var(--ui); }
.prim > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.prim .n { font-weight: var(--w-bold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prim .h { font: 500 var(--fs-xs)/var(--lh-xs) var(--mono); color: var(--text-2); }
.prim .rec { position: absolute; top: 8px; right: 8px; height: 20px; padding: 0 8px; border-radius: 999px; background: rgba(43,99,245,.12); color: #2457E0; font-size: var(--fs-xs); font-weight: var(--w-bold); display: inline-flex; align-items: center; }
html[data-theme="dark"] .prim .rec { color: #7B9DFF; background: rgba(123,157,255,.14); }
.strip .note { margin: 0; font-size: var(--fs-xs); line-height: 18px; color: var(--text-2); max-width: 1100px; }
.strip .note b { color: var(--text); }

/* ============ desk, browser window, fake website ============ */
#stage { padding: 8px 24px 28px; }
.desk { display: flex; max-width: 1360px; margin: 0 auto; height: calc(100vh - 230px); min-height: 680px; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px rgba(15,23,42,.08), 0 24px 60px -24px rgba(15,23,42,.25); background: #fff; }
.win { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chrome { height: 44px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #F0F1F4; border-bottom: 1px solid rgba(15,23,42,.07); }
.chrome .lights { display: flex; gap: 7px; } .chrome .lights i { width: 11px; height: 11px; border-radius: 50%; background: #D5D7DC; }
.chrome .url { flex: 1; min-width: 0; max-width: 520px; height: 28px; border-radius: 999px; background: #fff; display: flex; align-items: center; padding: 0 14px; font-size: 12.5px; color: #4b4f57; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chrome .ext { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: #E2E4E8; }
.logo { display: inline-grid; place-items: center; background: #161616; color: #fff; font: 600 11px/1 "Fraunces", serif; width: 18px; height: 18px; border-radius: 5px; position: relative; flex: none; }
.logo::after { content: ""; position: absolute; right: 18%; top: 18%; width: 18%; height: 18%; border-radius: 1px; background: #ff5a36; }
.vp { flex: 1; position: relative; overflow: hidden; background: #fbfaf7; }
.site { height: 100%; overflow: auto; padding-bottom: 120px; color: #1b1a17; }
.s-nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; border-bottom: 1px solid rgba(0,0,0,.06); }
.s-nav b { font: 600 16px/1 "Inter"; letter-spacing: -.01em; }
.s-nav nav { display: flex; gap: 22px; font: 400 13.5px/1 "Inter"; color: #3b3a36; }
.s-art { max-width: 720px; margin: 0 auto; padding: 44px 48px 0; }
.s-kick { font: 500 11.5px/1 "Inter"; letter-spacing: .12em; color: #8a6d3b; margin: 0 0 18px; }
.s-art h1 { font: 600 50px/1.04 "Fraunces", serif; letter-spacing: -.02em; margin: 0 0 20px; }
.s-lede { font: 400 20px/1.5 "Source Serif 4", serif; color: #2f2d29; margin: 0 0 22px; }
.s-art p.b { font: 400 17px/1.65 "Source Serif 4", serif; color: #3a3833; margin: 0 0 18px; }
.s-art h2 { font: 600 26px/1.15 "Fraunces", serif; margin: 30px 0 12px; }
.s-fig { height: 200px; border-radius: 6px; background: linear-gradient(135deg, #c9d6cf, #e8dcc5 60%, #d9c3a5); margin: 8px 0; }
.s-cap { font: 400 12.5px/1.4 "Inter"; color: #7a776f; margin: 0 0 24px; }
.site.mine h1, .site.mine h2 { font-family: var(--my-h) !important; }
.site.mine .s-lede, .site.mine p.b { font-family: var(--my-b) !important; }
.site.scaled h1 { font-size: var(--sc-h1) !important; } .site.scaled h2 { font-size: var(--sc-h2) !important; } .site.scaled .s-lede { font-size: var(--sc-lead) !important; } .site.scaled .s-cap { font-size: var(--sc-cap) !important; }
.on [data-f] { cursor: crosshair; }
.on [data-f]:hover, [data-f].sel { outline: 1.5px solid var(--p); outline-offset: 3px; border-radius: 2px; }
html[data-theme="dark"][data-primary="ink"] .on [data-f]:hover, html[data-theme="dark"][data-primary="ink"] [data-f].sel { outline-color: #1C2024; }
[data-f].flash { outline: 2px solid var(--p); outline-offset: 4px; border-radius: 2px; background: var(--p-soft); }

/* dock: stays dark; a grip on the left moves it; the active tool takes the primary colour */
.dock { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 2px; padding: 6px 6px 6px 2px; border-radius: 16px; background: #1a1b1e; box-shadow: 0 12px 32px rgba(0,0,0,.28); color: rgba(255,255,255,.72); touch-action: none; }
.dock.dragging { box-shadow: 0 18px 40px rgba(0,0,0,.35); }
.dock .grip { width: 22px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: rgba(255,255,255,.4); cursor: grab; touch-action: none; }
.dock .grip:hover { color: rgba(255,255,255,.8); }
.dock.dragging .grip { cursor: grabbing; }
.dock .db { position: relative; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; transition: background 150ms, color 150ms, transform 140ms var(--ease); }
.dock .db svg { width: 20px; height: 20px; }
.dock .db:hover { background: rgba(255,255,255,.08); color: #fff; }
.dock .db:active { transform: scale(.94); }
.dock .db[aria-pressed="true"] { background: var(--dock-on); color: #fff; }
.dock .db.soft[aria-pressed="true"] { background: rgba(255,255,255,.12); }
.dock .sep { width: 1px; height: 22px; margin: 0 4px; background: rgba(255,255,255,.14); }
.dock .db .tip { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%) translateY(2px); white-space: nowrap; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; border-radius: 8px; background: #1a1b1e; color: #fff; font: 600 12px/1 var(--ui); pointer-events: none; opacity: 0; transition: opacity 120ms, transform 160ms var(--ease); }
@media (hover: hover) { .dock .db:hover .tip { opacity: 1; transform: translateX(-50%); transition-delay: 250ms; } }
.dock .tip .k { font: 500 11px/1 var(--mono); color: rgba(255,255,255,.6); padding: 3px 5px; border-radius: 4px; background: rgba(255,255,255,.1); }

/* hover card (sits on the website, so it stays light) */
.hc { position: absolute; z-index: 31; width: 288px; max-width: calc(100% - 24px); padding: 12px; border-radius: var(--r12); background: #fff; color: #1C2024; box-shadow: 0 0 0 1px rgba(15,23,42,.05), 0 4px 16px rgba(15,23,42,.10); display: flex; flex-direction: column; gap: 12px; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity 120ms var(--ease), transform 160ms var(--ease); font: 400 13px/20px var(--ui); }
.hc.show { opacity: 1; transform: none; } .hc.pinned { pointer-events: auto; }
.hc.is-pinned { box-shadow: 0 0 0 1.5px var(--p), 0 4px 16px rgba(15,23,42,.12); }
html[data-theme="dark"][data-primary="ink"] .hc.is-pinned { box-shadow: 0 0 0 1.5px #1C2024, 0 4px 16px rgba(15,23,42,.12); }
.hc-h { display: flex; align-items: flex-start; gap: 8px; }
.hc-h > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.hc-h b { font-size: 16px; line-height: 24px; letter-spacing: -.01em; }
.hc-h small { color: #60646C; font-size: 12px; line-height: 16px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pinchip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 999px; background: rgba(15,23,42,.045); color: #1C2024; font-size: 12px; font-weight: 600; }
.pinchip svg { width: 12px; height: 12px; }
.hc-m { height: 80px; border-radius: 8px; background: rgba(15,23,42,.045); position: relative; overflow: hidden; }
.hc-m .g { position: absolute; left: 12px; bottom: 10px; font-size: 56px; line-height: 1; color: #1C2024; }
.hc-m i { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed rgba(15,23,42,.18); }
.hc-m i span { position: absolute; right: 10px; top: -14px; font: 500 9.5px/1 var(--mono); color: #60646C; }
.hc-g { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hc-g .f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hc-g .f > span { font-size: 12px; line-height: 16px; color: #60646C; }
.hc-g button { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 8px; background: rgba(15,23,42,.045); font: 500 12px/1 var(--mono); color: #1C2024; min-width: 0; transition: background 120ms; }
.hc-g button > svg { width: 14px; height: 14px; color: #60646C; }
.hc-g button > em { font-style: normal; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; text-align: left; }
.hc.pinned .hc-g button:hover { background: rgba(15,23,42,.085); }
.hc-a { display: flex; gap: 8px; }
.hc-a button { flex: 1; height: 36px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: rgba(15,23,42,.045); }
.hc-a button.pri { background: var(--p); color: var(--on-p); }
html[data-theme="dark"][data-primary="ink"] .hc-a button.pri { background: #1C2024; color: #fff; }
.hc-a .sq { flex: none; width: 36px; }
.hc-a svg { width: 16px; height: 16px; }
.hc-hint { margin: 0; font-size: 12px; line-height: 16px; color: #60646C; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.hc .kbd, .coach .kbd { background: rgba(15,23,42,.06); color: #1C2024; }
.coach { position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%); z-index: 29; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; border-radius: var(--r12); background: #fff; color: #1C2024; box-shadow: 0 0 0 1px rgba(15,23,42,.05), 0 4px 16px rgba(15,23,42,.10); width: max-content; max-width: calc(100% - 24px); }
.coach .step { font: 500 11px/1 var(--mono); color: #60646C; }
.coach .msg { line-height: 20px; }
.coach button { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: #60646C; flex: none; }
.coach button:hover { background: rgba(15,23,42,.045); }

/* ============ shared bits ============ */
/* keys: quiet mono text in a soft pill. No border, no shadow. */
.kbd { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--well-2); font: 500 11.5px/1 var(--mono); color: var(--text); white-space: nowrap; word-spacing: -.1em; vertical-align: 1px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.lic { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); line-height: var(--lh-xs); font-weight: var(--w-bold); white-space: nowrap; }
.lic.free { color: var(--free); } .lic.free .dot { background: var(--free-dot); }
.lic.paid { color: var(--paid); } .lic.paid .dot { background: var(--paid-dot); }
.hc .lic.free { color: #0b7a37; } .hc .lic.paid { color: #8a5a00; }
.count { font: 500 var(--fs-xs)/1 var(--mono); color: var(--text-2); }

.btn { height: var(--ctl); padding: 0 12px; border-radius: var(--r8); background: var(--well); font-weight: var(--w-bold); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; transition: background 150ms, transform 140ms var(--ease); }
.btn:hover { background: var(--well-2); }
.btn:active { transform: scale(.97); }
.btn svg { width: 16px; height: 16px; }
.btn.pri { background: var(--p); color: var(--on-p); }
.btn.pri:hover { background: var(--p-hover); }
.btn.quiet { background: none; color: var(--text-2); padding: 0 8px; }
.btn.quiet:hover { background: var(--well); color: var(--text); }
.btn.danger { color: var(--red); }
html[data-theme="dark"] .btn.danger { color: #ff6b61; }
.btn.dangerfill { background: var(--red); color: #fff; }
.btn.wide { width: 100%; }
.btn .badge { height: 18px; min-width: 18px; padding: 0 5px; border-radius: 999px; background: rgba(255,255,255,.24); font: 600 11px/18px var(--mono); text-align: center; }
html[data-theme="dark"][data-primary="ink"] .btn .badge { background: rgba(0,0,0,.12); }
.link { color: var(--p-text); font-weight: var(--w-bold); display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link svg { width: 14px; height: 14px; }
.ib { width: var(--ib); height: var(--ib); border-radius: var(--r8); display: grid; place-items: center; color: var(--text-2); transition: background 120ms, color 120ms; flex: none; }
.ib:hover { background: var(--well); color: var(--text); }
.ib svg { width: 16px; height: 16px; }
.ib[aria-pressed="true"] { background: var(--p-soft); color: var(--p-text); }
.switch { width: 36px; height: 22px; border-radius: 999px; background: var(--well-2); position: relative; flex: none; transition: background 180ms var(--ease); }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.25); transition: transform 220ms var(--ease); }
.switch[aria-checked="true"] { background: var(--p); }
.switch[aria-checked="true"]::after { transform: translateX(14px); }
html[data-theme="dark"][data-primary="ink"] .switch[aria-checked="true"]::after { background: #111113; }
@media (pointer: coarse) { .switch { width: 44px; height: 26px; } .switch::after { width: 20px; height: 20px; } .switch[aria-checked="true"]::after { transform: translateX(18px); } }

/* well fields: grey, no border, a leading icon, small grey label 6px above */
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > label, .fld > .fl { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-2); }
.well { height: var(--ctl); display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: var(--r8); background: var(--well); min-width: 0; text-align: left; }

.app { flex: 1; overflow: auto; overflow-x: hidden; position: relative; }

.select { flex: 1; min-width: 0; height: var(--ctl); display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: var(--r8); background: var(--well); text-align: left; }

.pop { position: absolute; z-index: 20; min-width: 220px; padding: 4px; border-radius: var(--r12); background: var(--panel); box-shadow: var(--pop); display: flex; flex-direction: column; }

/* sections: no boxes and no lines. Spacing and the heading carry the structure. */

.steps3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.step { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.step .art .acc, .drop .ill .acc { stroke: var(--p-text); } .step .art .accf, .drop .ill .accf { fill: var(--p-text); } .step .art .ink, .drop .ill .ink { fill: var(--text); }
.step .ht span { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-2); }

.swap .mt { display: inline-flex; gap: 8px; align-items: center; }
.swap > svg { justify-self: center; width: 16px; height: 16px; color: var(--text-2); }
.notice { display: flex; align-items: flex-start; gap: 12px; padding: 12px; margin: 0 -12px; border-radius: var(--r12); text-align: left; width: calc(100% + 24px); transition: background 120ms; }
.notice:hover { background: var(--hover); }

.expand { padding: 0 0 4px 28px; display: flex; flex-direction: column; gap: 8px; color: var(--text-2); }

.fr { position: relative; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-radius: var(--r12); transition: background 120ms; }

.fr-t { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 20px; }
.fr-t .n { font: 500 11px/1 var(--mono); color: var(--text-3); }
.fr-t b { font-size: var(--fs-md); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.fr-t .acts { display: flex; margin: -8px -8px -8px auto; }
.fr .smp { font-size: 28px; line-height: 1.15; letter-spacing: -.01em; overflow-wrap: anywhere; color: var(--text); }
.fr-b { display: flex; align-items: center; gap: 8px; min-width: 0; }
.fr-b span { flex: 1; min-width: 0; font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--text-2); }
.fr-b .link { height: var(--ib); padding: 0 8px; margin: -6px -8px -6px 0; border-radius: var(--r8); }
.tester { display: grid; grid-template-columns: 1fr 128px; gap: 8px; }

/* details */

.yes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }

.files { display: flex; flex-direction: column; gap: 4px; }

/* image: drop area without a boxed icon */
.drop { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding: 24px 16px; border-radius: var(--r16); background: var(--panel-2); }

.thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.thumbs .th { width: 100%; aspect-ratio: 4/3; border-radius: var(--r8); display: grid; place-items: end start; padding: 8px; color: rgba(255,255,255,.9); font: 600 15px/1 var(--ui); transition: transform 160ms var(--ease); }

/* system */

@media (pointer: coarse) { .rseg button { height: 40px; } }
table.scale { width: 100%; border-collapse: collapse; }

.entry { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: var(--r12); background: var(--panel-2); text-align: left; width: 100%; transition: background 120ms; }

/* settings dialog */
.scrim { position: fixed; inset: 0; z-index: 90; background: rgba(15,23,42,.28); display: grid; place-items: center; padding: 16px; }
.dlg { width: min(720px, 100%); height: min(540px, calc(100vh - 32px)); border-radius: var(--r16); background: var(--panel); color: var(--text); box-shadow: var(--pop); display: grid; grid-template-columns: 200px 1fr; overflow: hidden; position: relative; }

.thumb i { position: absolute; left: 12%; right: 12%; height: 10%; border-radius: 3px; background: rgba(127,127,140,.4); }
.thumb i:nth-child(1) { top: 16%; } .thumb i:nth-child(2) { top: 36%; right: 40%; } .thumb i:nth-child(3) { top: 56%; height: 22%; background: var(--p); opacity: .9; right: 52%; }

.about .logo { width: 40px; height: 40px; border-radius: 10px; font-size: 22px; }
.about > div { display: flex; flex-direction: column; gap: 6px; }
.links { display: flex; flex-direction: column; gap: 2px; margin: 0 -12px; }
.links > a, .links > button { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 12px; border-radius: var(--r12); color: var(--text); text-decoration: none; }
.links > a:hover, .links > button:hover { background: var(--hover); }
.links svg { width: 16px; height: 16px; color: var(--text-2); }
.links .link { margin-left: auto; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 14px; border-radius: var(--r12); background: #1a1b1e; color: #fff; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.view { display: flex; flex-direction: column; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ============ responsive ============ */
.dfoot .mobq { display: none !important; }
@media (max-width: 1100px) { .prims { grid-template-columns: repeat(2, minmax(0, 1fr)); } .desk { height: calc(100vh - 120px); } }
@media (max-width: 900px) { .s-art { padding: 28px 24px 0; } .s-art h1 { font-size: 38px; } .s-nav { padding: 16px 24px; } .s-nav nav { display: none; } .sp { width: 340px; } }
@media (max-width: 720px) {
  .strip { padding: 16px; }
  .prim { padding: 10px; gap: 10px; flex-wrap: wrap; } .prim .sw { width: 28px; height: 28px; }
  .prim .rec { top: auto; bottom: auto; right: 8px; top: 8px; height: 18px; padding: 0 6px; font-size: 11px; }
  .prim .rec + * {}
  #stage { padding: 8px 0 20px; }
  .desk { flex-direction: column; height: auto; border-radius: 0; }
  .vp { height: 600px; flex: none; }
  .sp { width: 100%; height: 820px; border-left: 0; border-top: 1px solid rgba(15,23,42,.1); }
  .hc.is-pinned .hc-m { display: none; }
  .dlg { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: calc(100vh - 32px); }
  .dnav { flex-direction: row; flex-wrap: wrap; padding: 12px 52px 8px 12px; }
  .dnav .ov { width: 100%; padding-bottom: 6px; }
  .dnav .bottom { display: none; }
  .dscroll { padding: 16px; }
  .dfoot { padding: 12px 16px; justify-content: space-between; }
  .dfoot .mobq { display: inline-flex !important; }
  .themes { gap: 8px; }
}
@media (pointer: coarse) { .dnav button { height: 44px; } }
</style>

  library: () => `<section class="sec" style="padding-top:12px;padding-bottom:8px"><div class="row"><label class="well inp grow">${ic("Search01")}<input placeholder="Search your library" aria-label="Search your library"></label><button class="sqw" style="width:var(--inp);height:var(--inp)" data-toast="Filters: licence, style, where it comes from" aria-label="Filters" title="Filters">${ic("FilterHorizontal")}</button></div></section>
    <section class="sec"><div class="hrow"><div class="ht"><h3>Collections</h3></div><button class="ib" data-toast="New collection" aria-label="New collection" title="New collection">${ic("PlusSign")}</button></div>
      <div class="list">${[["Editorial", ["#e86f4a", "#f2c14e"], 6], ["Client: Ledgerly", ["#4a7ee8", "#9ab8f2"], 4], ["Display", ["#5a5f6a", "#a3a8b2"], 9]].map(([n, c, k]) => `<button class="colrow" data-col="${n}" aria-pressed="${st.col === n}"><span class="sw">${c.map((x) => `<i style="background:${x}"></i>`).join("")}</span><b>${n}</b><span class="count">${k}</span></button>`).join("")}</div></section>
    <section class="sec"><div class="hrow"><div class="ht"><h3>${st.col ? esc(st.col) : "Saved"} <span class="count">${st.col ? 2 : 12}</span></h3></div>${st.col ? `<button class="btn quiet" data-col="${st.col}" style="margin:-6px -8px 0 0">Show all</button>` : ""}</div>
      <div class="list">${["fraunces", "serif"].map((k, i) => fontRow(k, i, true)).join("")}</div></section>
    <section class="sec"><div class="list"><button class="colrow" data-toast="Opens the history">${ic("Clock01")}<b>Fonts I've seen</b>${ic("ArrowRight01")}</button><button class="colrow" data-toast="Opens Boards">${ic("DashboardSquare01")}<b>Boards</b>${ic("ArrowRight01")}</button></div>
      <div class="row"><button class="btn quiet" data-toast="Library saved as a file" style="margin-left:-8px">${ic("Download01")}Export library</button><button class="btn quiet" data-toast="Pick a library file">${ic("Upload01")}Import</button></div></section>`,
};

/* ---------- settings dialog ---------- */
const SNAV = [["appearance", "Palette", "Appearance"], ["inspecting", "CursorPointer01", "Inspecting"], ["google", "Lock", "Google Fonts key"], ["data", "Folder01", "Your data"], ["about", "InformationCircle", "About"]];
const SBODY = {
  appearance: () => `<div class="dhead"><h2 class="t-xl">Appearance</h2><p>How the panel looks. The page you are reading is never changed.</p></div>
    <div class="themes" role="group" aria-label="Theme">${[["system", "System"], ["light", "Light"], ["dark", "Dark"]].map(([k, n]) => `<button data-theme-set="${k}" aria-pressed="${st.theme === k}"><span class="thumb ${k}"><i></i><i></i><i></i></span>${n}</button>`).join("")}</div>
    <div class="setrow"><div><b>“How it works” guide</b><span class="s">A short guide at the top of the Page tab, for when you're new.</span></div><button class="switch" role="switch" aria-checked="${st.guide}" aria-label="How it works guide" data-act="guideSet"></button></div>`,
  inspecting: () => `<div class="dhead"><h2 class="t-xl">Inspecting</h2><p>What Font Finder Plus reads, and when.</p></div>
    <div class="setrow"><div><b>Read fonts on every site</b><span class="s">${st.readAll ? "On. Font Finder Plus can open font files on any site, so it can show the foundry, format and metrics." : "Off. Sites that block their font files will be missing the foundry, format and metrics."}</span></div><button class="switch" role="switch" aria-checked="${st.readAll}" aria-label="Read fonts on every site" data-act="readAll"></button></div>
    <div class="setrow"><div><b>Fonts I've seen</b><span class="s">${st.seen ? "On. The fonts on pages you read are kept in a history on this computer, so you can find them later." : "Off. Turn it on to keep a history of the fonts on pages you read."}</span>${st.seen ? `<button class="btn" style="align-self:flex-start;margin-top:6px" data-toast="Opens the history">${ic("Clock01")}Open the history</button>` : ""}</div><button class="switch" role="switch" aria-checked="${st.seen}" aria-label="Fonts I've seen" data-act="seen"></button></div>`,
  google: () => `<div class="dhead"><h2 class="t-xl">Google Fonts key <span class="pill">Optional</span></h2><p>Font Finder Plus has a built-in list of 1,950 Google Fonts. Add a key to use the live list instead, with fonts added since 26 October 2026. The key stays on this computer.</p></div>
    <div class="fld"><label for="gk">API key</label><div class="well inp">${ic("Lock")}<input id="gk" type="${st.keyShow ? "text" : "password"}" placeholder="Paste your key" autocomplete="off" spellcheck="false"><button class="ib" data-act="keyShow" aria-label="${st.keyShow ? "Hide key" : "Show key"}" style="margin-right:-8px">${ic(st.keyShow ? "ViewOff" : "View")}</button></div></div>
    <div class="row" style="margin-top:-12px"><button class="btn" data-toast="Key saved">Save key</button><button class="btn quiet" data-toast="Testing the key">Test key</button><span class="grow"></span><a class="link" href="#" data-toast="Opens Google's guide">Get a key${ic("ArrowUpRight01")}</a></div>`,
  data: () => `<div class="dhead"><h2 class="t-xl">Your data</h2><p>Your library and history stay on this computer, and nothing about your browsing is sent anywhere. Font files only come from the sites that already use them, and free look-alikes from Google Fonts and Fontshare.</p></div>
    <div class="setrow"><div><b>Library file</b><span class="s">Save your library as a file, to back it up or move it to another computer.</span><div class="row" style="margin-top:6px;flex-wrap:wrap"><button class="btn" data-toast="Library saved as a file">${ic("Download01")}Export library</button><button class="btn" data-toast="Pick a library file">${ic("Upload01")}Import library</button></div></div></div>
    <div class="setrow"><div>${st.wipe ? `<div class="confirm" role="alert"><b>Delete all your data?</b><p>This removes your saved fonts, collections, boards, history and screenshots from this computer. It can't be undone. Export your library first if you want a copy.</p><div class="crow"><button class="btn dangerfill" data-act="wipeYes">Delete everything</button><button class="btn" data-act="wipe">Cancel</button></div></div>`
      : `<b>Delete all my data</b><span class="s">Removes everything Font Finder Plus keeps on this computer.</span><button class="btn danger" data-act="wipe" style="align-self:flex-start;margin-top:6px">${ic("Delete02")}Delete all my data</button>`}</div></div>`,
  about: () => `<div class="about"><span class="logo">F</span><div><h2 class="t-xl" style="margin:0">Font Finder Plus 0.1.0</h2><span class="t-xs">Built-in list of 1,950 Google Fonts, updated 26 October 2026.</span></div></div>
    <div class="links"><button data-toast="Opens the shortcuts">${ic("Keyboard")}Keyboard shortcuts<span class="link">See all${ic("ArrowRight01")}</span></button><a href="#" data-toast="Opens the privacy page">${ic("Lock")}Privacy<span class="link">Read${ic("ArrowUpRight01")}</span></a><a href="#" data-toast="Opens your email">${ic("Mail01")}Send feedback<span class="link">Email us${ic("ArrowUpRight01")}</span></a><a href="#" data-toast="Opens the Chrome Web Store">${ic("Star")}Rate it<span class="link">Web Store${ic("ArrowUpRight01")}</span></a></div>`,
};
const settings = () => !st.settings ? "" : `<div class="scrim" data-scrim><div class="dlg" role="dialog" aria-modal="true" aria-label="Settings">
  <nav class="dnav" aria-label="Settings sections"><span class="ov">Settings</span>${SNAV.map(([k, i, n]) => `<button data-settings="${k}" aria-current="${st.settings === k}">${ic(i)}${n}</button>`).join("")}
    <div class="bottom"><button class="btn quiet" data-act="offAll" style="justify-content:flex-start">${ic("Power")}Turn off on this page</button><button class="btn quiet" data-act="resetTips" style="justify-content:flex-start">${ic("Undo02")}Reset tips</button></div></nav>
  <div class="dbody"><div class="dscroll">${SBODY[st.settings]()}</div><div class="dfoot"><button class="btn quiet mobq" data-act="resetTips">${ic("Undo02")}Reset tips</button><button class="btn pri" data-act="closeSettings">Done</button></div></div>
  <button class="ib dclose" data-act="closeSettings" aria-label="Close settings">${ic("Cancel01")}</button></div></div>`;

const panel = () => `<aside class="sp" aria-label="Chrome side panel"><div class="sp-chrome"><span class="logo">F</span>Font Finder Plus<span class="x"><button aria-label="Pin the panel" data-toast="Pinned to the toolbar">${ic("Pin", 15)}</button><button data-dock="panel" aria-label="Close the panel">${ic("Cancel01", 15)}</button></span></div>
  <div class="app" id="app">${head()}<div class="view">${st.view ? V.detail(st.view) : st.sub ? V[st.sub]() : V[st.tab]()}</div></div></aside>`;

/* ---------- render and behaviour ---------- */
const stage = document.getElementById("stage");
let lastEl = null;
function render(keepScroll = true) {
  const sc = document.querySelector(".site")?.scrollTop || 0, ap = keepScroll ? document.getElementById("app")?.scrollTop || 0 : 0;
  const ds = document.querySelector(".dscroll")?.scrollTop || 0;
  stage.innerHTML = `<div class="desk"><div class="win"><div class="chrome"><span class="lights"><i></i><i></i><i></i></span><span class="url">fieldjournal.example/essays/the-lake</span><button class="ext" aria-label="Font Finder Plus" data-act="ext"><span class="logo">F</span></button></div>
    <div class="vp" id="vp">${site()}${st.on ? coach() + dock() + hoverCard() : ""}</div></div>${st.panel ? panel() : ""}</div>${settings()}`;
  const s = document.querySelector(".site"); if (s) s.scrollTop = sc;
  const a = document.getElementById("app"); if (a) { a.scrollTop = ap; a.classList.toggle("scrolled", ap > 0); a.addEventListener("scroll", () => a.classList.toggle("scrolled", a.scrollTop > 0), { passive: true }); }
  const d = document.querySelector(".dscroll"); if (d) d.scrollTop = ds;
  if (st.pinned && st.el != null) { const el = document.querySelectorAll(".site [data-f]")[st.el]; el?.classList.add("sel"); place(el); }
  clampDock();
  strip();
}
let toastT;
function toast(m) { document.querySelector(".toast")?.remove(); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = m; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2200); }
function pin(el) { const all = [...document.querySelectorAll(".site [data-f]")]; st.pinned = true; st.el = all.indexOf(el); st.hover = el.dataset.f; st.tag = el.tagName.toLowerCase(); if (st.coach < 2) st.coach = 2; }
function place(el) {
  const vp = document.getElementById("vp"), hc = vp?.querySelector(".hc");
  if (!hc || !el) return;
  const rg = document.createRange(); rg.selectNodeContents(el); const r = rg.getClientRects()[0] || el.getBoundingClientRect(); const v = vp.getBoundingClientRect();
  const er = el.getBoundingClientRect(); let top = er.bottom - v.top + 12; if (top + hc.offsetHeight > v.height - 12) top = Math.max(8, er.top - v.top - hc.offsetHeight - 12);
  top = Math.min(top, Math.max(8, v.height - hc.offsetHeight - 8));
  const left = Math.min(Math.max(12, r.left - v.left), v.width - hc.offsetWidth - 12);
  hc.style.top = top + "px"; hc.style.left = Math.max(12, left) + "px"; hc.classList.add("show"); hc.classList.toggle("pinned", st.pinned);
}
function showOnPage(key) {
  const s = document.querySelector(".site"); const els = [...document.querySelectorAll(`.site [data-f="${key}"]`)];
  if (!s || !els[0]) return;
  s.scrollTop = Math.max(0, els[0].offsetTop - s.clientHeight / 3);
  els.forEach((x) => x.classList.add("flash")); setTimeout(() => els.forEach((x) => x.classList.remove("flash")), 2200);
  const vp = document.getElementById("vp").getBoundingClientRect(); if (vp.bottom < 0 || vp.top > innerHeight) toast(`${FONTS[key].name} is outlined on the page above`);
}
const panelVisible = () => { const a = document.getElementById("app"); if (!a) return false; const r = a.getBoundingClientRect(); return r.top < innerHeight - 80 && r.bottom > 80; };

/* dock dragging: pointer (mouse and touch) on the grip, arrow keys when the grip has focus */
function clampDock() {
  const dk = document.querySelector(".dock"), vp = document.getElementById("vp");
  if (!dk || !vp || !st.dock) return;
  st.dock.x = Math.max(8, Math.min(st.dock.x, vp.clientWidth - dk.offsetWidth - 8));
  st.dock.y = Math.max(8, Math.min(st.dock.y, vp.clientHeight - dk.offsetHeight - 8));
  dk.style.left = st.dock.x + "px"; dk.style.top = st.dock.y + "px"; dk.style.transform = "none"; dk.style.bottom = "auto";
}
function dockStart() { const dk = document.querySelector(".dock"), vp = document.getElementById("vp"); const a = dk.getBoundingClientRect(), v = vp.getBoundingClientRect(); st.dock = { x: a.left - v.left, y: a.top - v.top }; clampDock(); return { dk, a }; }
document.addEventListener("pointerdown", (e) => {
  const g = e.target.closest("[data-grip]"); if (!g) return;
  e.preventDefault();
  const { dk, a } = dockStart(); const ox = e.clientX - a.left, oy = e.clientY - a.top;
  dk.classList.add("dragging"); try { g.setPointerCapture(e.pointerId); } catch {}
  const mv = (ev) => { const v = document.getElementById("vp").getBoundingClientRect(); st.dock.x = ev.clientX - v.left - ox; st.dock.y = ev.clientY - v.top - oy; clampDock(); };
  const up = () => { dk.classList.remove("dragging"); g.removeEventListener("pointermove", mv); g.removeEventListener("pointerup", up); g.removeEventListener("pointercancel", up); };
  g.addEventListener("pointermove", mv); g.addEventListener("pointerup", up); g.addEventListener("pointercancel", up);
});

document.addEventListener("mouseover", (e) => {
  if (!st.on || st.pinned) return;
  const el = e.target.closest(".site [data-f]"); if (!el) return;
  lastEl = el; st.tag = el.tagName.toLowerCase(); if (st.coach === 0) { st.coach = 1; const c = document.querySelector(".coach .msg"); if (c) { c.innerHTML = COACH[1](); document.querySelector(".coach .step").textContent = "2/3"; } }
  st.hover = el.dataset.f; const hc = document.querySelector("#vp .hc"); if (hc) hc.outerHTML = hoverCard();
  place(el);
});
document.addEventListener("mouseout", (e) => { if (!st.pinned && e.target.closest?.(".site [data-f]") && !e.relatedTarget?.closest?.(".site [data-f]")) document.querySelector("#vp .hc")?.classList.remove("show"); });
document.addEventListener("input", (e) => {
  if (e.target.id === "tt") { st.text = e.target.value; document.querySelectorAll(".fr .smp").forEach((s) => (s.textContent = st.text || SAMPLE)); }
  if (e.target.id === "sz") { st.size = +e.target.value; document.getElementById("szv").textContent = st.size; document.querySelectorAll(".fr .smp").forEach((s) => (s.style.fontSize = st.size + "px")); }
});
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest('a[href="#"]')) e.preventDefault();
  if (t.closest("[data-grip]")) return;
  const pr = t.closest("[data-prim]"); if (pr) { st.primary = pr.dataset.prim; document.documentElement.dataset.primary = st.primary; return strip(); }
  const th = t.closest("[data-theme-set]"); if (th) { st.theme = th.dataset.themeSet; document.documentElement.dataset.theme = st.theme === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : st.theme; return render(); }
  if (st.menu && !t.closest(".pop") && !t.closest("[data-menu]")) { st.menu = null; render(); if (!t.closest("[data-tab],[data-settings],[data-act]")) return; }
  const pop = t.closest("[data-pop]"); if (pop) { st.menu = null; toast(pop.dataset.pop); return render(); }
  const mn = t.closest("[data-menu]"); if (mn) { st.menu = st.menu === mn.dataset.menu ? null : mn.dataset.menu; return render(); }
  if (t.matches("[data-scrim]")) { st.settings = null; st.wipe = false; return render(); }
  const se = t.closest("[data-settings]"); if (se) { st.settings = se.dataset.settings; st.wipe = false; st.menu = null; return render(); }
  const tst = t.closest("[data-toast]"); if (tst) toast(tst.dataset.toast);
  const tab = t.closest("[data-tab]"); if (tab) { st.tab = tab.dataset.tab; st.view = null; st.sub = null; return render(false); }
  const det = t.closest("[data-detail]"); if (det) { st.view = det.dataset.detail; st.sec = "Licence"; return render(false); }
  if (t.closest("[data-back]")) { st.view = null; return render(false); }
  const sb = t.closest("[data-sub]"); if (sb) { st.sub = sb.dataset.sub; return render(false); }
  if (t.closest("[data-sub-back]")) { st.sub = null; st.slotOpen = null; return render(false); }
  const sec = t.closest("[data-sec]"); if (sec) { st.sec = sec.dataset.sec; return render(); }
  const ex = t.closest("[data-exp]"); if (ex) { st.exp = ex.dataset.exp; return render(); }
  const mf = t.closest("[data-myfmt]"); if (mf) { st.myFmt = mf.dataset.myfmt; return render(); }
  const ra = t.closest("[data-ratio]"); if (ra) { st.ratio = +ra.dataset.ratio; return render(); }
  const co = t.closest("[data-col]"); if (co) { st.col = st.col === co.dataset.col ? null : co.dataset.col; return render(); }
  const sl = t.closest("[data-slot]"); if (sl) { st.slotOpen = st.slotOpen === sl.dataset.slot ? null : sl.dataset.slot; return render(); }
  const pk = t.closest("[data-pick]"); if (pk) { const [k, v] = pk.dataset.pick.split(":"); st.slots[k] = v === "null" ? null : v; st.slotOpen = null; return render(); }
  const sh = t.closest("[data-show]"); if (sh) { showOnPage(sh.dataset.show); return; }
  const act = t.closest("[data-act]")?.dataset.act;
  const flips = { guide: () => { st.guide = false; }, guideSet: () => { st.guide = !st.guide; }, readAll: () => { st.readAll = !st.readAll; }, seen: () => { st.seen = !st.seen; }, missing: () => { st.missing = !st.missing; }, dev: () => { st.dev = !st.dev; }, figma: () => { st.figma = !st.figma; }, keyShow: () => { st.keyShow = !st.keyShow; }, wipe: () => { st.wipe = !st.wipe; },
    mine: () => { st.mine = !st.mine; toast(st.mine ? "Your fonts are showing on the page" : "The page is back as it was"); },
    try: () => { st.trying = !st.trying; toast(st.trying ? `Showing the ×${st.ratio} scale on the page` : "The page is back as it was"); },
    swap: () => { st.swapped = !st.swapped; toast(st.swapped ? "Showing free fonts on the page" : "The page is back as it was"); },
    wipeYes: () => { st.wipe = false; toast("All your data was deleted"); },
    closeSettings: () => { st.settings = null; st.wipe = false; },
    offAll: () => { st.settings = null; st.on = false; st.pinned = false; toast("Turned off. Press ⌥⇧F or click the icon to start again"); },
    resetTips: () => { st.coach = 0; st.guide = true; st.on = true; toast("The tips will show again"); },
    again: () => { toast("Read the page again. Nothing changed"); },
    toggle: () => { st.on = !st.on; st.pinned = false; st.menu = null; },
    coach: () => { st.coach = 3; }, replay: () => { st.coach = 0; st.on = true; },
    ext: () => { if (!st.on) st.on = true; else st.panel = true; } };
  if (act && flips[act]) { flips[act](); return render(); }
  const cp = t.closest("[data-copy]"); if (cp) { const b = cp.querySelector("em"), old = b.innerHTML; b.textContent = "Copied"; setTimeout(() => { b.innerHTML = old; }, 1100); if (st.coach === 2) { st.coach = 3; document.querySelector(".coach")?.remove(); } return; }
  if (t.closest("[data-copycss]")) { toast("CSS copied: font, size, weight, line height, spacing, colour"); if (st.coach === 2) { st.coach = 3; document.querySelector(".coach")?.remove(); } return; }
  const hcb = t.closest("[data-hc]"); if (hcb) {
    if (hcb.dataset.hc === "details") { st.panel = true; st.view = st.hover; st.sub = null; st.sec = "Licence"; render(false); if (!panelVisible()) toast("Details opened in the panel below"); return; }
    st.pinned = false; st.el = null; return render();
  }
  const d = t.closest("[data-dock]");
  if (d) {
    const k = d.dataset.dock;
    if (k === "panel") st.panel = !st.panel;
    if (k === "inspect") { st.on = true; st.pinned = false; }
    if (k === "fonts") { st.panel = true; st.tab = "page"; st.view = null; st.sub = null; }
    if (k === "system") { st.panel = true; st.tab = "system"; st.view = null; st.sub = null; }
    if (k === "area") { st.panel = true; st.tab = "image"; st.view = null; st.sub = null; toast("Drag over any part of the page"); }
    if (k === "save") toast(st.hover ? `${FONTS[st.hover].name} saved to your library` : "Point at some text first");
    if (k === "off") { st.on = false; st.pinned = false; toast("Turned off. Press ⌥⇧F or click the icon to start again"); }
    return render(k !== "panel");
  }
  const el = t.closest(".site [data-f]");
  if (el && st.on) {
    const all = [...document.querySelectorAll(".site [data-f]")];
    if (st.pinned && all.indexOf(el) === st.el) { st.pinned = false; st.el = null; return render(); }
    lastEl = el; pin(el); return render();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.target.closest?.("[data-grip]") && e.key.startsWith("Arrow")) { e.preventDefault(); if (!st.dock) dockStart(); const n = e.shiftKey ? 40 : 10; if (e.key === "ArrowLeft") st.dock.x -= n; if (e.key === "ArrowRight") st.dock.x += n; if (e.key === "ArrowUp") st.dock.y -= n; if (e.key === "ArrowDown") st.dock.y += n; return clampDock(); }
  if (e.key === "Escape") { if (st.settings) st.settings = null; else if (st.menu) st.menu = null; else if (st.pinned) { st.pinned = false; st.el = null; } else if (st.view) st.view = null; else if (st.sub) st.sub = null; else st.on = false; return render(); }
  if (st.settings) return;
  if (e.altKey && e.shiftKey && e.code === "KeyF") { st.on = !st.on; render(); }
  if (e.code === "Space" && st.on && document.querySelector("#vp .hc.show") && !e.target.closest("button")) { e.preventDefault(); if (st.pinned) { st.pinned = false; st.el = null; } else if (lastEl) pin(lastEl); render(); }
  if ((e.key === "c" || e.key === "C") && !e.metaKey && !e.ctrlKey && st.on && st.hover && document.querySelector("#vp .hc.show")) { toast(`CSS for ${FONTS[st.hover].name} copied`); if (st.coach === 2) { st.coach = 3; render(); } }
});
document.addEventListener("scroll", (e) => { if (e.target.classList?.contains("site") && st.pinned) place(document.querySelectorAll(".site [data-f]")[st.el]); }, true);
addEventListener("resize", () => clampDock());
render();
</script>
</body>
</html>
