<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Font Finder Plus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500&family=Fraunces:opsz,wght@9..144,400&family=Instrument+Serif&family=Space+Grotesk:wght@400&family=Arimo&family=Playfair+Display&family=DM+Mono&family=Lobster&family=Oswald:wght@500&display=swap">
<style>
:root {
  --desk: #e5e5e5; --bg: #f2f2f2; --sheet: #ffffff; --ink: #171717; --ink-2: #525252; --ink-3: #737373;
  --line: rgba(0,0,0,0.08); --field: #f2f2f2; --hover: #e5e5e5; --field-2: #e5e5e5;
  --free: #0b7a37; --free-dot: #19a35a; --paid: #8a5a00; --paid-dot: #e39b12;
  --ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --r-card: 18px; --r-ctl: 11px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #050505; --bg: #0d0d0d; --sheet: #171717; --ink: #f2f2f2; --ink-2: #a3a3a3; --ink-3: #8a8a8a;
  --line: rgba(255,255,255,0.08); --field: #262626; --hover: #333333; --field-2: #333333;
  --free: #6be29c; --free-dot: #3ad47a; --paid: #f2be6b; --paid-dot: #e39b12; color-scheme: dark; } }
:root[data-theme="dark"] {
  --desk: #050505; --bg: #0d0d0d; --sheet: #171717; --ink: #f2f2f2; --ink-2: #a3a3a3; --ink-3: #8a8a8a;
  --line: rgba(255,255,255,0.08); --field: #262626; --hover: #333333; --field-2: #333333;
  --free: #6be29c; --free-dot: #3ad47a; --paid: #f2be6b; --paid-dot: #e39b12; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 13px/1.45 var(--ui); -webkit-font-smoothing: antialiased; }
.desk { min-height: 100vh; display: flex; justify-content: center; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.panel { width: 400px; max-width: 100%; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 120px; }
button { font: inherit; color: inherit; }
h2 { margin: 0; font: 500 14px/1.3 var(--ui); }
p { margin: 0; }
.box { background: var(--sheet); border-radius: var(--r-card); padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.faint { color: var(--ink-3); }
.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.brand { font-weight: 600; font-size: 13px; padding: 0 4px; }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--sheet); border-radius: 13px; flex: 1; }
.tabs button { flex: 1; height: 28px; border: 0; background: transparent; border-radius: 10px; color: var(--ink-2); cursor: pointer; }
.tabs button[aria-current] { background: var(--field); color: var(--ink); }
.iconbtn { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--ink-3); cursor: pointer; flex: none; transition: background-color 150ms ease, color 150ms ease, transform 160ms var(--ease-out); }
@media (hover: hover) and (pointer: fine) { .iconbtn:hover { background: var(--hover); color: var(--ink); } }
.iconbtn[aria-pressed="true"] { color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: var(--r-ctl); border: 0; background: var(--field); cursor: pointer; font-weight: 500; color: var(--ink); white-space: nowrap; text-decoration: none; transition: background-color 150ms ease, opacity 150ms ease, transform 160ms var(--ease-out); }
.btn.primary { background: var(--ink); color: var(--sheet); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
@media (hover: hover) and (pointer: fine) { .btn:not(.primary):hover { background: var(--field-2); } .btn.primary:hover { opacity: 0.88; } }
.on-grey .btn:not(.primary) { background: var(--sheet); }
@media (hover: hover) and (pointer: fine) { .on-grey .btn:not(.primary):hover { background: var(--hover); } }
.iconbtn:active, .btn:active { transform: scale(0.97); }
:is(.iconbtn, .btn, .tabs button, .row, .link, .chip):focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.link { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; color: var(--ink-2); font-weight: 500; font-size: 12.5px; cursor: pointer; text-decoration: none; }
.link:hover { color: var(--ink); }
.lic { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; flex: none; }
.lic i { width: 6px; height: 6px; border-radius: 50%; }
.lic.free { color: var(--free); } .lic.free i { background: var(--free-dot); }
.lic.paid { color: var(--paid); } .lic.paid i { background: var(--paid-dot); }
.lic.unknown { color: var(--ink-3); } .lic.unknown i { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.tip { position: relative; }
.tip::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translate(-50%, 2px); background: var(--ink); color: var(--sheet); font: 500 11.5px/1 var(--ui); padding: 6px 8px; border-radius: 9px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 120ms ease-out, transform 160ms var(--ease-out); z-index: 4; }
.tip:hover::after, .tip:focus-visible::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 250ms; }
.toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 8px 14px; border-radius: 12px; font-size: 12.5px; z-index: 20; animation: toastin 200ms var(--ease-out); white-space: nowrap; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }


/* Library. Same tokens as Page v2, Details, Image and System. Inner boxes use the lighter --inset grey. */
:root { --inset: #f8f8f8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --inset: #212121; } }
:root[data-theme="dark"] { --inset: #212121; }
.sechead { display: flex; align-items: baseline; gap: 8px; }
.sechead .count { color: var(--ink-3); font-size: 12px; }
.sechead .grow { flex: 1; }
.sub { font-size: 12.5px; color: var(--ink-3); }
.chev { display: inline-flex; color: var(--ink-3); transition: transform 200ms var(--ease-out); }

/* Search row */
.searchbar { display: flex; align-items: center; gap: 6px; background: var(--sheet); border-radius: 16px; padding: 6px 6px 6px 14px; }
.searchbar .s { color: var(--ink-3); flex: none; display: inline-flex; align-items: center; }
.searchbar input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: var(--ink); height: 30px; outline: none; padding-left: 4px; }
.searchbar input::placeholder { color: var(--ink-3); }
.searchbar .iconbtn { position: relative; }
.searchbar .iconbtn[aria-expanded="true"], .searchbar .iconbtn.on { background: var(--field); color: var(--ink); }
.dotbadge { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.seg2 { display: flex; padding: 2px; background: var(--field); border-radius: 11px; }
.seg2 button { width: 28px; height: 26px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.seg2 button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); }

/* Filters, opened from the filter button */
.filters { gap: 14px; animation: fadein 200ms var(--ease-out); }
.fgroup { display: flex; flex-direction: column; gap: 8px; }
.fgroup > span { font-size: 12px; color: var(--ink-3); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 10px; border: 0; background: var(--field); cursor: pointer; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; transition: background-color 150ms ease, transform 160ms var(--ease-out); flex: none; }
@media (hover: hover) and (pointer: fine) { .chip:not([aria-pressed="true"]):hover { background: var(--field-2); } }
.chip:active { transform: scale(0.97); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.chip .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .n { color: var(--sheet); opacity: 0.6; }
.chip .sw { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.ffoot { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); }

/* Collections: one line that scrolls sideways, never a wall of chips */
.colrow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px; mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 24px), transparent); }
.colrow::-webkit-scrollbar { display: none; }
.colrow .chip { background: var(--sheet); }
.colrow .chip[aria-pressed="true"] { background: var(--ink); }
@media (hover: hover) and (pointer: fine) { .colrow .chip:not([aria-pressed="true"]):hover { background: var(--hover); } }
.colbar { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 18px; }
.colbar b { font-weight: 500; flex: 1; }

/* The tester, as approved on Page v2 */
.tester { display: flex; align-items: center; gap: 10px; background: var(--sheet); border-radius: 16px; padding: 6px 14px; }
.tester svg { color: var(--ink-3); flex: none; }
.tester input[type=text] { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: var(--ink); height: 32px; outline: none; }
.tester input[type=text]::placeholder { color: var(--ink-3); }
.tester .px { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; width: 34px; text-align: right; }
.tester input[type=range] { width: 84px; accent-color: var(--ink); }

/* Font cards */
.grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.fcard { background: var(--sheet); border-radius: var(--r-card); padding: 8px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; min-width: 0; position: relative; }
.fcard .spec { background: var(--inset); border-radius: 12px; height: 96px; display: flex; align-items: center; padding: 0 12px; overflow: hidden; color: var(--ink); line-height: 1.05; overflow-wrap: anywhere; }
.fcard .spec span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fcard .meta { display: flex; flex-direction: column; gap: 3px; padding: 0 6px 6px; min-width: 0; }
.fcard .nm { display: flex; align-items: center; gap: 6px; min-width: 0; }
.fcard .nm b { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.fcard .sm2 { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.fcard .more { position: absolute; top: 12px; right: 12px; background: var(--sheet); opacity: 0; transition: opacity 150ms ease; }
@media (hover: hover) and (pointer: fine) { .fcard:hover .more, .fcard:focus-within .more, .lrow:hover .more, .lrow:focus-within .more { opacity: 1; } }
@media (hover: none) { .fcard .more { opacity: 1; } }
.list { display: flex; flex-direction: column; gap: 8px; }
.lrow { background: var(--sheet); border-radius: var(--r-card); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; position: relative; }
.lrow .nm { display: flex; align-items: center; gap: 8px; }
.lrow .nm b { font-weight: 500; }
.lrow .nm .s { font-size: 12px; color: var(--ink-3); flex: 1; }
.lrow .spec { line-height: 1.15; overflow-wrap: anywhere; color: var(--ink); }
.lrow .more { opacity: 0; transition: opacity 150ms ease; }
.pin { position: absolute; z-index: 6; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); min-width: 210px; padding: 4px; background: var(--sheet); border-radius: 14px; box-shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(0,0,0,0.14); z-index: 10; transform-origin: top right; animation: ddin 160ms var(--ease-out); }
@keyframes ddin { from { opacity: 0; transform: scale(0.97); } }
.menu button, .menu label { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; text-align: left; font-size: 13px; color: var(--ink); }
.menu button:hover, .menu label:hover { background: var(--field); }
.menu svg { color: var(--ink-2); flex: none; }
.menu .sep { height: 1px; background: var(--line); margin: 4px 6px; }
.menu .mlbl { font-size: 11.5px; color: var(--ink-3); padding: 6px 10px 2px; }
.menu .tick { margin-left: auto; color: var(--ink); }
.anchor { position: relative; }

/* Shortcuts to Boards and Fonts I've seen */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { all: unset; box-sizing: border-box; background: var(--sheet); border-radius: var(--r-card); padding: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: transform 160ms var(--ease-out); }
.tile:active { transform: scale(0.98); }
.tile:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.tile .ic { width: 32px; height: 32px; border-radius: 11px; background: var(--inset); display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); flex: none; }
.tile .t { display: flex; flex-direction: column; min-width: 0; }
.tile .t b { font-weight: 500; }
.tile .t span { font-size: 12px; color: var(--ink-3); }

/* Version 2: Folders. Collections are the home; fonts live inside them. */
.rows { display: flex; flex-direction: column; }
.go { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 36px 1fr auto 14px; gap: 12px; align-items: center; padding: 12px 18px; cursor: pointer; transition: background-color 150ms ease; }
.go + .go { border-top: 1px solid var(--line); }
@media (hover: hover) and (pointer: fine) { .go:hover { background: var(--inset); } }
.go:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.go .ic { width: 36px; height: 36px; border-radius: 12px; background: var(--inset); display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); overflow: hidden; font-size: 17px; }
.go .t { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.go .t b { font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.go .t span { font-size: 12px; color: var(--ink-3); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.go .v { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.listbox { padding: 6px 0; gap: 0; overflow: hidden; }
.listbox .sechead { padding: 10px 18px 6px; }
.back { all: unset; display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); font-weight: 500; cursor: pointer; padding: 4px 6px; border-radius: 10px; align-self: flex-start; }
.back:hover { color: var(--ink); }
.back:focus-visible { outline: 2px solid var(--ink); }
.pagehead { display: flex; align-items: center; gap: 8px; }
.pagehead .grow { flex: 1; }

/* Version 3: Sections. Saved, Seen and Boards side by side as one control. */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; background: var(--sheet); border-radius: 13px; }
.seg button { height: 30px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.seg button[aria-current] { background: var(--field); color: var(--ink); }
.seg button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

/* Fonts I've seen */
.recbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 18px; }
.recdot { width: 8px; height: 8px; border-radius: 50%; background: var(--free-dot); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--free-dot) 20%, transparent); }
.recdot.off { background: var(--ink-3); box-shadow: none; }
.recbar span { flex: 1; font-size: 12.5px; color: var(--ink-2); }
.seen { display: flex; flex-direction: column; }
.seenrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 14px 0; border-top: 1px solid var(--line); cursor: pointer; }
.seenrow:first-child { border-top: 0; padding-top: 4px; }
.seenrow .n { font-size: 19px; line-height: 1.2; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.seenrow .w { font-size: 12px; color: var(--ink-3); grid-column: 1 / -1; }
.seenrow .w a { color: var(--ink-2); text-decoration: none; }
.sites { display: flex; flex-direction: column; }
.site { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.site:first-child { border-top: 0; }
.site b { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.site span { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.site.paused b { color: var(--ink-3); }
.danger { color: #b42318; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .danger { color: #ff8a80; } }

/* Boards */
.boards { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.board { all: unset; box-sizing: border-box; min-width: 0; background: var(--sheet); border-radius: var(--r-card); padding: 8px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
.board:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.board .thumb { border-radius: 12px; height: 104px; padding: 12px; display: flex; flex-direction: column; justify-content: center; gap: 2px; overflow: hidden; }
.board .thumb.light { background: var(--inset); color: var(--ink); }
.board .thumb.dark { background: #171717; color: #f2f2f2; box-shadow: inset 0 0 0 1px var(--line); }
.board .thumb span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
.board .meta { padding: 0 6px 6px; display: flex; flex-direction: column; gap: 2px; }
.board .meta b { font-weight: 500; }
.board .meta span { font-size: 12px; color: var(--ink-3); }
.board.new .thumb { background: transparent; border: 1.5px dashed var(--field-2); align-items: center; color: var(--ink-2); gap: 6px; }

.empty { align-items: flex-start; }
.empty p { color: var(--ink-2); }

/* Sub pages: the back button sits in its own container, as in the old design */
.subtop { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.backbtn { width: 40px; height: 40px; border-radius: 14px; border: 0; background: var(--sheet); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; transition: background-color 150ms ease, transform 160ms var(--ease-out); }
@media (hover: hover) and (pointer: fine) { .backbtn:hover { background: var(--hover); } }
.backbtn:active { transform: scale(0.97); }
.backbtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.crumb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; overflow: hidden; white-space: nowrap; }
.crumb span { color: var(--ink-3); flex: none; }
.crumb .sl { color: var(--field-2); }
.crumb b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.newcol { color: var(--ink) !important; }

/* Board image: what the PNG looks like */
.bimg { border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; position: relative; min-height: 120px; }
.bimg.light { background: #ffffff; color: #171717; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
.bimg.dark { background: #141414; color: #f2f2f2; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
.bline { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bline .bt { font-size: 28px; line-height: 1.1; overflow-wrap: anywhere; }
.bline .bn { font-size: 11px; opacity: 0.55; font-family: var(--ui); }
.bmark { font-size: 10.5px; opacity: 0.45; align-self: flex-end; }
.bimg.small { padding: 12px; gap: 6px; height: 112px; min-height: 0; overflow: hidden; }
.bimg.small .bt { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.bimg.small .bn { display: none; }
.bempty { align-items: center; justify-content: center; font-size: 12.5px; opacity: 0.6; }
.bempty span { opacity: 0.8; }
.board .bimg.light { background: var(--inset); box-shadow: none; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld > span { font-size: 12px; color: var(--ink-3); }
.fld input { height: 36px; border: 0; border-radius: var(--r-ctl); background: var(--inset); padding: 0 12px; font: inherit; color: var(--ink); outline: none; box-shadow: inset 0 0 0 1px var(--line); }
.fld input:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
.seg3 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg3 button { height: 36px; border: 0; border-radius: var(--r-ctl); background: var(--inset); box-shadow: inset 0 0 0 1px var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: var(--ink-2); font-weight: 500; }
.seg3 button[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); background: var(--sheet); }
