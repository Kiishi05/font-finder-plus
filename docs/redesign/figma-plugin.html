<title>Figma Plugin Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&family=Inter:wght@400&family=Fraunces:opsz,wght@9..144,400&family=Lobster&family=JetBrains+Mono&family=Libre+Caslon+Text&family=Arimo&family=Tinos&family=Courier+Prime&family=Roboto+Mono&display=swap">
<style>
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #050505; --bg: #0d0d0d; --sheet: #171717; --ink: #f2f2f2; --ink-2: #a3a3a3; --ink-3: #8a8a8a;
  --line: rgba(255,255,255,0.08); --field: #262626; --hover: #333333; --field-2: #333333;
  --free: #6be29c; --free-dot: #3ad47a; --paid: #f2be6b; --paid-dot: #e39b12; color-scheme: dark; } }
:root[data-theme="dark"] {
  --desk: #050505; --bg: #0d0d0d; --sheet: #171717; --ink: #f2f2f2; --ink-2: #a3a3a3; --ink-3: #8a8a8a;
  --line: rgba(255,255,255,0.08); --field: #262626; --hover: #333333; --field-2: #333333;
  --free: #6be29c; --free-dot: #3ad47a; --paid: #f2be6b; --paid-dot: #e39b12; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 13px/1.45 var(--ui); -webkit-font-smoothing: antialiased; }
.desk { min-height: 100vh; display: flex; justify-content: center; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.panel { width: 400px; max-width: 100%; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 120px; }
button { font: inherit; color: inherit; }

p { margin: 0; }
.box { background: var(--sheet); border-radius: var(--r-card); padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.faint { color: var(--ink-3); }
.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.brand { font-weight: 600; font-size: 13px; padding: 0 4px; }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--sheet); border-radius: 13px; flex: 1; }
.tabs button { flex: 1; height: 28px; border: 0; background: transparent; border-radius: 10px; color: var(--ink-2); cursor: pointer; }
.tabs button[aria-current] { background: var(--field); color: var(--ink); }
.iconbtn { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--ink-3); cursor: pointer; flex: none; transition: background-color 150ms ease, color 150ms ease, transform 160ms var(--ease-out); }
@media (hover: hover) and (pointer: fine) { .iconbtn:hover { background: var(--hover); color: var(--ink); } }
.iconbtn[aria-pressed="true"] { color: var(--ink); }

.btn.primary { background: var(--ink); color: var(--sheet); }

@media (hover: hover) and (pointer: fine) { .btn:not(.primary):hover { background: var(--field-2); } .btn.primary:hover { opacity: 0.88; } }
.on-grey .btn:not(.primary) { background: var(--sheet); }
@media (hover: hover) and (pointer: fine) { .on-grey .btn:not(.primary):hover { background: var(--hover); } }
.iconbtn:active, .btn:active { transform: scale(0.97); }
:is(.iconbtn, .btn, .tabs button, .row, .link, .chip):focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.link { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; color: var(--ink-2); font-weight: 500; font-size: 12.5px; cursor: pointer; text-decoration: none; }
.link:hover { color: var(--ink); }

.lic i { width: 6px; height: 6px; border-radius: 50%; }
.lic.free { color: var(--free); } .lic.free i { background: var(--free-dot); }
.lic.paid { color: var(--paid); } .lic.paid i { background: var(--paid-dot); }
.lic.unknown { color: var(--ink-3); } .lic.unknown i { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.tip { position: relative; }
.tip::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translate(-50%, 2px); background: var(--ink); color: var(--sheet); font: 500 11.5px/1 var(--ui); padding: 6px 8px; border-radius: 9px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 120ms ease-out, transform 160ms var(--ease-out); z-index: 4; }
.tip:hover::after, .tip:focus-visible::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 250ms; }
.toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 8px 14px; border-radius: 12px; font-size: 12.5px; z-index: 20; animation: toastin 200ms var(--ease-out); white-space: nowrap; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }


/* Figma plugin. Same tokens as the side panel: grey page, white cards, ink buttons. */
:root { --inset: #f8f8f8; --ok: #0b7a37; --ok-dot: #19a35a; --sys: #525252; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --inset: #212121; --ok: #6be29c; --ok-dot: #3ad47a; --sys: #a3a3a3; } }
body { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 72px 16px 40px; }
.desk, .panel { display: contents; }
#stage { width: 420px; max-width: 100%; }
.fwin { position: relative; width: 100%; height: 640px; background: var(--bg); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 20px 50px rgba(0,0,0,0.18); }
.ftitle { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 14px; background: var(--sheet); border-bottom: 1px solid var(--line); flex: none; }

.ftitle b { font-weight: 500; }
.ftitle .grow { flex: 1; }
.x { width: 30px; height: 30px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.x:hover { background: var(--field); color: var(--ink); }
.fbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--sheet); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card p { color: var(--ink-3); font-size: 12.5px; }
.btn { height: 38px; border-radius: 13px; }
.btn.wide { width: 100%; height: 44px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.lic.system { color: var(--sys); } .lic.system i { background: var(--ink-3); }
.lic.free { color: var(--ok); } .lic.free i { background: var(--ok-dot); }

/* Start */
.ph { display: flex; flex-direction: column; gap: 4px; }

.paste { all: unset; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 16px; border-radius: 16px; background: var(--field); border: 1.5px dashed var(--field-2); text-align: center; cursor: pointer; transition: border-color 150ms ease; }

.paste:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.paste .pic { color: var(--ink-2); margin-bottom: 4px; display: inline-flex; }
.paste b { font-weight: 500; font-size: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); }
.steps b { font-weight: 500; color: var(--ink); }
.steps .n { width: 20px; height: 20px; border-radius: 50%; background: var(--field); color: var(--ink); font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; flex: none; margin-top: -1px; }
.recheck { flex-direction: row; align-items: center; gap: 12px; padding: 14px 14px 14px 18px; }

/* Fonts */
.sitecard { gap: 12px; }
.sh { display: flex; align-items: flex-start; gap: 8px; }
.sh > div { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sh b { font-weight: 500; font-size: 15px; }
.sh span { font-size: 12px; color: var(--ink-3); }
.meter { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.d { width: 8px; height: 8px; border-radius: 50%; }
.d.ok { background: var(--ok-dot); } .d.sub { background: var(--field-2); }
.group { gap: 0; padding: 16px 0 6px; }
.gh { display: flex; align-items: baseline; gap: 8px; padding: 0 18px 8px; }
.gh .count { color: var(--ink-3); font-size: 12px; }
.gsub { padding: 0 18px 10px; margin-top: -4px; }
.frow { border-top: 1px solid var(--line); }
.fhead { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 18px; cursor: pointer; }
.fhead:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.fhead .fs { flex: 1; min-width: 0; font-size: 19px; line-height: 1.2; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.fhead .chev { display: inline-flex; color: var(--ink-3); transition: transform 200ms var(--ease-out); }
.fhead[aria-expanded="true"] .chev { transform: rotate(180deg); }
.stand { display: flex; align-items: center; gap: 10px; padding: 0 18px 12px; margin-top: -4px; }
.stand .sl { font-size: 12px; color: var(--ink-3); flex: none; }
.dd { position: relative; flex: 1; min-width: 0; }
.dd > button { width: 100%; height: 34px; border: 0; border-radius: 11px; background: var(--field); display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; cursor: pointer; font: inherit; color: var(--ink); }
.dd > button > span:first-child { flex: 1; text-align: left; font-size: 13.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dd .pct { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.dd .chev { display: inline-flex; color: var(--ink-3); transition: transform 200ms var(--ease-out); }
.dd.on .chev { transform: rotate(180deg); }
.dd ul { position: absolute; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--sheet); border-radius: 13px; box-shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(0,0,0,0.14); z-index: 5; animation: ddin 150ms var(--ease-out); transform-origin: top; }
@keyframes ddin { from { opacity: 0; transform: scale(0.97); } }
.dd li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.dd li:hover { background: var(--field); }
.dd li span:first-child { flex: 1; font-size: 14px; }
.dd li svg, .dd li i { width: 16px; height: 16px; flex: none; }
.more { padding: 0 18px 14px; display: flex; flex-direction: column; gap: 8px; animation: fadein 200ms var(--ease-out); }
.kv { display: flex; gap: 12px; font-size: 12.5px; }
.kv span { width: 76px; flex: none; color: var(--ink-3); }
.kv b { font-weight: 400; }
.more p { font-size: 12px; }
.create { gap: 4px; }
.create h2 { margin-bottom: 8px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.opt:nth-of-type(1) { border-top: 0; }
.oi { width: 32px; height: 32px; border-radius: 10px; background: var(--inset); display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); flex: none; }
.ot { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.ot b { font-weight: 500; } .ot span { font-size: 12px; color: var(--ink-3); }
.switch { width: 34px; height: 20px; border-radius: 10px; background: var(--field-2); border: 0; position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--sheet); box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform 160ms var(--ease-out); }
.switch[aria-checked="true"] { background: var(--ink); }
.switch[aria-checked="true"]::after { transform: translateX(14px); }
.foot { flex: none; padding: 10px; background: var(--bg); border-top: 1px solid var(--line); }

/* Creating and done */
.prog { gap: 16px; }
.bar { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 3px; transition: width 400ms var(--ease-out); }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.plist li { display: flex; align-items: center; gap: 10px; color: var(--ink-3); }
.plist li.done, .plist li.now { color: var(--ink); }
.pi { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.pi i { width: 6px; height: 6px; border-radius: 50%; background: var(--field-2); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--field-2); border-top-color: var(--ink); animation: spin 800ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.donecard { gap: 16px; }
.dicon { width: 44px; height: 44px; border-radius: 14px; background: color-mix(in srgb, var(--ok-dot) 14%, transparent); color: var(--ok); display: inline-flex; align-items: center; justify-content: center; }
.donecard h2 { font-size: 16px; margin-bottom: 4px; }
.made { display: flex; flex-direction: column; background: var(--inset); border-radius: 14px; padding: 4px 14px; }
.mrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.mrow:first-child { border-top: 0; }
.mrow .tag { font-size: 11.5px; padding: 2px 7px; border-radius: 7px; background: var(--sheet); color: var(--ink-2); min-width: 44px; text-align: center; }
.mrow b { font-weight: 500; flex: 1; }
.stdin { font-size: 11px; color: #8a5a00; background: #fbefd9; padding: 2px 7px; border-radius: 99px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stdin { color: #f2be6b; background: rgba(242,176,74,0.14); } }
.center { align-self: center; padding: 8px; }
.toast2 { position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 8px 14px; border-radius: 12px; font-size: 12.5px; white-space: nowrap; animation: toastin 200ms var(--ease-out); z-index: 20; }

/* Prototype chrome: jump between screens */
.screens { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10,10,10,0.86); box-shadow: 0 8px 24px rgba(0,0,0,0.24); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.screens button { height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,0.6); cursor: pointer; }
.screens button[data-active] { background: rgba(255,255,255,0.14); color: #fff; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Round 2 */
.recheck { flex-direction: column; align-items: stretch; gap: 12px; padding: 18px; }
.btn.wide2 { width: 100%; height: 40px; flex: none; }
.note { justify-content: flex-start; align-items: flex-start; gap: 8px; padding: 4px 8px; }
.note svg { flex: none; margin-top: 2px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 4px; background: var(--sheet); border-radius: 14px; }
.seg button { height: 34px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); font: 500 13px var(--ui); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button .n { color: var(--ink-3); font-weight: 400; }
.seg button[aria-current] { background: var(--field); color: var(--ink); }
.hintline { font-size: 12.5px; color: var(--ink-3); padding: 2px 8px; }
.fcard { gap: 12px; }
.fmeta { display: flex; align-items: center; gap: 8px; }
.fmeta b { font-weight: 500; }
.fmeta .grow { flex: 1; }
.link.sm { font-size: 12.5px; }
.link .chev { display: inline-flex; transition: transform 200ms var(--ease-out); }
.link[aria-expanded="true"] .chev { transform: rotate(180deg); }
.sample { font-size: 26px; line-height: 1.15; color: var(--ink); }
.fcard .stand { padding: 0; margin: 0; }
.fcard .more { padding: 12px 0 0; border-top: 1px solid var(--line); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tiles div { background: var(--inset); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.tiles b { font: 500 20px var(--ui); }
.tiles span { font-size: 12px; color: var(--ink-3); }
.scroll > .btn.wide2 { background: var(--sheet); }
@media (hover: hover) and (pointer: fine) { .scroll > .btn.wide2:hover { background: var(--hover); } }
.btn.getit { align-self: flex-start; margin-top: 8px; height: 38px; }

</style>

4 3 16.2426 3 12Z\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"></path><path d=\"M3.5 8H20.5\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"></path><path d=\"M10.5 13L12 14.5M12 14.5L13.5 16M12 14.5L13.5 13M12 14.5L10.5 16M16 11.5C16.6325 12.3628 17 13.3932 17 14.5C17 15.6068 16.6325 16.6372 16 17.5M8 11.5C7.36755 12.3628 7 13.3932 7 14.5C7 15.6068 7.36755 16.6372 8 17.5\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"></path></svg>", "ClipboardL": "<svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M17.0235 3.03358L16.0689 2.77924C13.369 2.05986 12.019 1.70018 10.9555 2.31074C9.89196 2.9213 9.53023 4.26367 8.80678 6.94841L7.78366 10.7452C7.0602 13.4299 6.69848 14.7723 7.3125 15.8298C7.92652 16.8874 9.27651 17.247 11.9765 17.9664L12.9311 18.2208C15.631 18.9401 16.981 19.2998 18.0445 18.6893C19.108 18.0787 19.4698 16.7363 20.1932 14.0516L21.2163 10.2548C21.9398 7.57005 22.3015 6.22768 21.6875 5.17016C21.0735 4.11264 19.7235 3.75295 17.0235 3.03358Z\" stroke=\"currentColor\" stroke-width=\"1.5\"></path><path d=\"M16.8538 7.43306C16.8538 8.24714 16.1901 8.90709 15.3714 8.90709C14.5527 8.90709 13.889 8.24714 13.889 7.43306C13.889 6.61898 14.5527 5.95904 15.3714 5.95904C16.1901 5.95904 16.8538 6.61898 16.8538 7.43306Z\" stroke=\"currentColor\" stroke-width=\"1.5\"></path><path d=\"M12 20.9463L11.0477 21.2056C8.35403 21.9391 7.00722 22.3059 5.94619 21.6833C4.88517 21.0608 4.52429 19.6921 3.80253 16.9547L2.78182 13.0834C2.06006 10.346 1.69918 8.97731 2.31177 7.89904C2.84167 6.96631 4 7.00027 5.5 7.00015\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.5\"></path></svg>", "DoneL": "<svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12Z\" stroke=\"currentColor\" stroke-width=\"1.5\"></path><path d=\"M8 12.5L10.5 15L16 9\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"></path></svg>"};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// The paste from Font Finder Plus: the same test site as the old screenshot.
const FONTS = [
  { n: 'Inter', css: "'Inter'", lic: 'free', licName: 'SIL Open Font Licence', have: true, roles: 'nav, body', src: 'Google Fonts', get: 'Google Fonts' },
  { n: 'Fraunces', css: "'Fraunces'", lic: 'free', licName: 'SIL Open Font Licence', have: true, roles: 'body, link, heading', src: 'Google Fonts', get: 'Google Fonts' },
  { n: 'Geist Mono', css: "'Geist Mono'", lic: 'free', licName: 'SIL Open Font Licence', have: true, roles: 'body', src: 'the site', get: 'Google Fonts' },
  { n: 'Lobster', css: "'Lobster'", lic: 'free', licName: 'SIL Open Font Licence', have: true, roles: 'heading', src: 'Google Fonts', get: 'Google Fonts' },
  { n: 'JetBrains Mono', css: "'JetBrains Mono'", lic: 'free', licName: 'SIL Open Font Licence', have: false, roles: 'body, code', src: 'the site', get: 'Google Fonts', alts: [['Geist Mono', 91], ['Roboto Mono', 88]] },
  { n: 'Libre Caslon Condensed', css: "'Libre Caslon Text'", lic: 'free', licName: 'SIL Open Font Licence', have: false, roles: 'body', src: 'the site', get: 'Google Fonts', alts: [['Fraunces', 74], ['Libre Caslon Text', 90]] },
  { n: 'Helvetica Neue LT Pro', css: "'Arimo'", lic: 'paid', licName: 'Commercial licence', have: false, roles: 'body', src: 'the site', get: 'Monotype', alts: [['Arimo', 100], ['Inter', 92]] },
  { n: 'Arial', css: "'Arimo'", lic: 'system', licName: 'Comes with the operating system', have: false, roles: 'caption', src: 'your computer', alts: [['Arimo', 100], ['Inter', 90]] },
  { n: 'Segoe UI', css: "'Inter'", lic: 'system', licName: 'Comes with the operating system', have: false, roles: 'button', src: 'your computer', alts: [['Inter', 99], ['Geist', 93]] },
  { n: 'Liberation Serif', css: "'Tinos'", lic: 'free', licName: 'Free for commercial use', have: false, roles: 'body', src: 'your computer', get: 'Red Hat', alts: [['Tinos', 100], ['Fraunces', 70]] },
  { n: 'Acme Mono', css: "'Geist Mono'", lic: 'unknown', licName: 'Licence not found', have: false, roles: 'body', src: 'script', alts: [['Geist Mono', 100], ['JetBrains Mono', 95]] },
  { n: 'Courier New', css: "'Courier Prime'", lic: 'system', licName: 'Comes with the operating system', have: false, roles: 'body', src: 'your computer', alts: [['Geist Mono', 53], ['Courier Prime', 94]] },
];
const LIC = { free: 'Free', paid: 'Paid', system: 'System', unknown: 'Unknown' };
const ROW_STYLES = [['h1', 'Fraunces', '48 / 52'], ['h2', 'Lobster', '24'], ['body', 'Inter', '17 / 27'], ['text', 'Acme Mono', '17 / 27'], ['link', 'Fraunces', '16'], ['nav', 'Inter', '14'], ['caption', 'Arial', '12']];

const st = { tab: 'missing', screen: 'start', open: null, dd: null, pick: {}, opts: { styles: true, vars: true, page: true }, prog: 0, installed: new Set(), toast: null };
FONTS.forEach((f) => { if (f.alts) st.pick[f.n] = f.alts[0][0]; });

const lic = (f) => `<span class="lic ${f.lic}"><i></i>${LIC[f.lic]}</span>`;
const have = (f) => f.have || st.installed.has(f.n);
const ready = () => FONTS.filter(have);
const missing = () => FONTS.filter((f) => !have(f));
const sw = (k) => `<button class="switch" role="switch" aria-checked="${st.opts[k]}" data-opt="${k}" aria-label="${k}"></button>`;

// ------------------------------------------------ screens
const start = () => `
  <div class="scroll">
    <section class="card pastecard">
      <div class="ph"><h2>Bring a website's type into Figma</h2><p>Text styles, variables and a specimen page, from any site you check with Font Finder Plus.</p></div>
      <button class="paste" data-paste aria-label="Paste from Font Finder Plus">
        <span class="pic">${ICON.ClipboardL}</span>
        <b>Paste from Font Finder Plus</b>
        <span class="faint">Press <kbd>⌘</kbd> <kbd>V</kbd> anywhere in this window</span>
      </button>
      <ol class="steps">
        <li><span class="n">1</span><span>In Chrome, open a website and click the Font Finder Plus icon</span></li>
        <li><span class="n">2</span><span>Click <b>Copy for Figma</b> on the Page or System tab</span></li>
        <li><span class="n">3</span><span>Come back here and paste</span></li>
      </ol>
    </section>
    <section class="card recheck">
      <div><b>3 text styles in this file use stand-ins</b><p>If you have installed the real fonts since, Check again swaps them into those text styles.</p></div>
      <button class="btn wide2" data-recheck>${ICON.RefreshIcon}Check again</button>
    </section>
    <p class="note">${ICON.SecurityLockIcon}<span>Nothing leaves your computer. This plugin makes no network requests.</span></p>
  </div>`;

const fontCard = (f) => {
  const i = FONTS.indexOf(f), open = st.open === i, miss = !have(f);
  return `
  <section class="card fcard">
    <div class="fmeta"><b>${esc(f.n)}</b>${lic(f)}<span class="grow"></span><button class="link sm" data-open="${i}" aria-expanded="${open}">${open ? 'Less' : 'Details'}<span class="chev">${ICON.ArrowDown01Icon}</span></button></div>
    <div class="sample" style="font-family:${miss ? `'${st.pick[f.n]}'` : f.css}, var(--ui)">The quick brown fox jumps over the lazy dog</div>
    ${miss ? `<div class="stand">
      <span class="sl">Stands in with</span>
      <div class="dd ${st.dd === i ? 'on' : ''}"><button data-dd="${i}" aria-haspopup="listbox" aria-expanded="${st.dd === i}"><span style="font-family:'${st.pick[f.n]}', var(--ui)">${st.pick[f.n]}</span><span class="pct">${f.alts.find(([n]) => n === st.pick[f.n])[1]}%</span><span class="chev">${ICON.ArrowDown01Icon}</span></button>
        ${st.dd === i ? `<ul role="listbox">${f.alts.map(([n, p]) => `<li role="option" aria-selected="${n === st.pick[f.n]}" data-pickalt="${i}:${n}"><span style="font-family:'${n}', var(--ui)">${n}</span><span class="pct">${p}%</span>${n === st.pick[f.n] ? ICON.Tick02Icon : '<i></i>'}</li>`).join('')}</ul>` : ''}</div>
    </div>` : ''}
    ${open ? `<div class="more">
      <div class="kv"><span>Licence</span><b>${f.licName}</b></div>
      <div class="kv"><span>Used for</span><b>${f.roles}</b></div>
      <div class="kv"><span>Served by</span><b>${f.src}</b></div>
      <p>${f.lic === 'paid' ? 'A paid licence is needed. What it covers depends on the licence you buy.' : f.lic === 'system' ? 'Comes with Windows or macOS. Sharing or embedding the file is a different matter.' : f.lic === 'unknown' ? "We couldn't find who makes this font or how it's licensed." : 'Free for personal and commercial use.'} This is a summary, not legal advice.</p>
      ${f.get ? `<a class="btn getit" href="#" data-toast="Opens ${f.get}">Get it from ${f.get} ${ICON.ArrowUpRight01Icon}</a>` : ''}
    </div>` : ''}
  </section>`;
};

const fonts = () => {
  const r = ready(), m = missing();
  if (!m.length) st.tab = 'ready';
  const list = st.tab === 'ready' ? r : m;
  return `
  <div class="scroll">
    <section class="card sitecard">
      <div class="sh"><div><b>thejournal.example</b><span>${FONTS.length} fonts · 7 text styles · Minor second scale</span></div></div>
      <div class="meter" aria-label="${r.length} of ${FONTS.length} fonts are in Figma"><i style="width:${(r.length / FONTS.length) * 100}%"></i></div>
      <div class="legend"><span><i class="d ok"></i>${r.length} in Figma</span><span><i class="d sub"></i>${m.length} use a free stand-in for now</span></div>
    </section>
    <div class="seg" role="tablist">${[['missing', 'Not in Figma', m.length], ['ready', 'In Figma', r.length]].map(([k, l, n]) => `<button role="tab" data-tab="${k}" ${st.tab === k ? 'aria-current="true"' : ''}>${l} <span class="n">${n}</span></button>`).join('')}</div>
    ${st.tab === 'missing' && m.length ? '<p class="hintline">A free look-alike stands in until you install the real font.</p>' : ''}
    ${list.map(fontCard).join('')}
    <section class="card create">
      <h2>Create</h2>
      <div class="opt"><span class="oi">${ICON.TextFontIcon}</span><span class="ot"><b>Text styles</b><span>7 styles, named like the site's HTML</span></span>${sw('styles')}</div>
      <div class="opt"><span class="oi">${ICON.VariableIcon}</span><span class="ot"><b>Variables</b><span>Sizes and line heights, linked to the styles</span></span>${sw('vars')}</div>
      <div class="opt"><span class="oi">${ICON.File01Icon}</span><span class="ot"><b>Specimen page</b><span>Every font with its licence and where to get it</span></span>${sw('page')}</div>
    </section>
    <button class="btn wide2" data-again>Paste another site</button>
  </div>
  <footer class="foot"><button class="btn primary wide" data-create ${Object.values(st.opts).some(Boolean) ? '' : 'disabled'}>Create in Figma</button></footer>`;
};

const STEPS = ['Loading fonts', 'Making 7 text styles', 'Adding 14 variables', 'Drawing the specimen page'];
const creating = () => `
  <div class="scroll">
    <section class="card prog">
      <h2>Creating in Figma</h2>
      <div class="bar"><i style="width:${Math.min(100, st.prog * 25)}%"></i></div>
      <ul class="plist">${STEPS.map((s, i) => `<li class="${i < st.prog ? 'done' : i === st.prog ? 'now' : ''}"><span class="pi">${i < st.prog ? ICON.Tick02Icon : i === st.prog ? '<span class="spin"></span>' : '<i></i>'}</span>${s}</li>`).join('')}</ul>
    </section>
  </div>`;

const done = () => {
  const m = missing();
  return `
  <div class="scroll">
    <section class="card donecard">
      <span class="dicon">${ICON.DoneL}</span>
      <div><h2>Done</h2><p>Everything is in this file. The specimen page shows each style with its font, licence and where to get it.</p></div>
      <div class="tiles"><div><b>7</b><span>Text styles</span></div><div><b>14</b><span>Variables</span></div><div><b>1</b><span>Page</span></div></div>
      <button class="btn primary wide" data-toast="Opens the specimen page">Go to the specimen page</button>
    </section>
    ${m.length ? `<section class="card recheck">
      <div><b>${m.length} fonts use stand-ins for now</b><p>Install ${m.slice(0, 2).map((f) => f.n).join(', ')}${m.length > 2 ? ` and ${m.length - 2} more` : ''} on your computer, then press Check again. It swaps the real fonts into your text styles, and everything using those styles updates.</p></div>
      <button class="btn wide2" data-recheck>${ICON.RefreshIcon}Check again</button>
    </section>` : ''}
    <button class="btn wide2" data-again>Paste another site</button>
  </div>`;
};

const SCREENS = { start, fonts, creating, done };
const view = () => `
  <div class="fwin">
    <div class="ftitle"><span class="logo">F+</span><b>Font Finder Plus</b><span class="grow"></span><button class="x" aria-label="Close" data-toast="Closes the plugin">${ICON.Cancel01Icon}</button></div>
    <div class="fbody">${SCREENS[st.screen]()}</div>
    ${st.toast ? `<div class="toast2" role="status">${st.toast}</div>` : ''}
  </div>`;

// ------------------------------------------------ behaviour
const stage = document.getElementById('stage');
let tTimer;
function toast(m) { st.toast = m; render(); clearTimeout(tTimer); tTimer = setTimeout(() => { st.toast = null; render(); }, 2200); }
function render() { const sc = stage.querySelector('.scroll'), y = sc ? sc.scrollTop : 0; stage.innerHTML = view(); const n = stage.querySelector('.scroll'); if (n) n.scrollTop = y; }
function go(s) { st.screen = s; st.open = null; st.dd = null; render(); const n = stage.querySelector('.scroll'); if (n) n.scrollTop = 0; }
function paste() { go('fonts'); }
function create() {
  go('creating'); st.prog = 0; render();
  const t = setInterval(() => { st.prog++; render(); if (st.prog >= 4) { clearInterval(t); setTimeout(() => go('done'), 350); } }, 520);
}
document.addEventListener('paste', (e) => { e.preventDefault(); if (st.screen === 'start') paste(); });
document.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'v' && st.screen === 'start') paste(); if (e.key === 'Escape' && st.dd != null) { st.dd = null; render(); } });
document.addEventListener('click', (e) => {
  const q = (s) => e.target.closest(s); let el;
  if (st.dd != null && !q('.dd')) { st.dd = null; render(); }
  if (q('[data-paste]')) return paste();
  if (q('[data-again]')) { st.installed.clear(); return go('start'); }
  if ((el = q('[data-dd]'))) { st.dd = st.dd === +el.dataset.dd ? null : +el.dataset.dd; return render(); }
  if ((el = q('[data-pickalt]'))) { const [i, n] = el.dataset.pickalt.split(':'); st.pick[FONTS[+i].n] = n; st.dd = null; return render(); }
  if ((el = q('[data-tab]'))) { st.tab = el.dataset.tab; st.open = null; return render(); }
  if ((el = q('[data-open]'))) { st.open = st.open === +el.dataset.open ? null : +el.dataset.open; return render(); }
  if ((el = q('[data-opt]'))) { st.opts[el.dataset.opt] = !st.opts[el.dataset.opt]; return render(); }
  if (q('[data-create]')) return create();
  if (q('[data-recheck]')) { const m = missing(); if (st.screen === 'done' && m.length) { st.installed.add(m[0].n); toast(`Swapped ${m[0].n} into its text styles`); } else toast('Swapped the real fonts into 3 text styles'); return; }
  if ((el = q('[data-toast]'))) { e.preventDefault(); toast(el.dataset.toast); }
});
// Prototype chrome: jump between screens
document.querySelectorAll('[data-screen]').forEach((b) => b.addEventListener('click', () => { if (b.dataset.screen === 'creating') create(); else go(b.dataset.screen); }));
const sync = () => document.querySelectorAll('[data-screen]').forEach((b) => b.toggleAttribute('data-active', b.dataset.screen === st.screen));
new MutationObserver(sync).observe(stage, { childList: true });
render(); sync();

</script>
