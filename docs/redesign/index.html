<title>Font Finder Plus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;600&family=Lobster&family=Arimo:wght@400;500&display=swap">
<style>
/* Layout: the side panel at its real 400px width on a quiet desk; only the font card changes between versions. */
:root {
  --desk: #e5e5e5; --bg: #f2f2f2; --sheet: #ffffff; --ink: #171717; --ink-2: #525252; --ink-3: #737373;
  --line: rgba(0,0,0,0.08); --field: #f2f2f2; --hover: #e5e5e5; --field-2: #e5e5e5; --free: #0b7a37; --free-dot: #19a35a; --paid: #8a5a00; --paid-dot: #e39b12;
  --ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --r-card: 14px; --r-ctl: 9px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #050505; --bg: #0d0d0d; --sheet: #171717; --ink: #f2f2f2; --ink-2: #a3a3a3; --ink-3: #8a8a8a;
  --line: rgba(255,255,255,0.08); --field: #262626; --hover: #333333; --field-2: #333333; --free: #6be29c; --free-dot: #3ad47a; --paid: #f2be6b; --paid-dot: #e39b12; color-scheme: dark; } }
:root[data-theme="dark"] {
  --desk: #050505; --bg: #0d0d0d; --sheet: #171717; --ink: #f2f2f2; --ink-2: #a3a3a3; --ink-3: #8a8a8a;
  --line: rgba(255,255,255,0.08); --field: #262626; --hover: #333333; --field-2: #333333; --free: #6be29c; --free-dot: #3ad47a; --paid: #f2be6b; --paid-dot: #e39b12; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 13px/1.45 var(--ui); -webkit-font-smoothing: antialiased; }
.desk { min-height: 100vh; display: flex; justify-content: center; padding-block: 0 96px; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.panel { width: 400px; max-width: 100%; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; gap: 12px; padding: 12px 12px 120px; }
button { font: inherit; color: inherit; }
.label { font: 12px var(--mono); color: var(--ink-3); }

/* shared chrome (identical in every version) */
.topbar { display: flex; align-items: center; gap: 8px; }
.brand { font-weight: 600; font-size: 13px; padding: 0 4px; }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--sheet); border-radius: 13px; flex: 1; }
.tabs button { flex: 1; height: 28px; border: 0; background: transparent; border-radius: 10px; color: var(--ink-2); cursor: pointer; }
.tabs button[aria-current] { background: var(--field); color: var(--ink); }
.iconbtn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--ink-2); cursor: pointer; flex: none; transition: background-color 150ms ease, color 150ms ease, transform 160ms var(--ease-out); }
.iconbtn:active, .btn:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .iconbtn:hover { background: var(--hover); color: var(--ink); } }
.iconbtn:focus-visible, .btn:focus-visible, .card:focus-visible, .row:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.iconbtn[aria-pressed="true"] { color: var(--ink); background: var(--field); }
.status { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; background: var(--sheet); border-radius: var(--r-card); position: relative; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); flex: none; }
.status .host { font-weight: 500; }
.status .muted { color: var(--ink-3); }
.switch { width: 34px; height: 20px; border-radius: 12px; background: var(--ink); border: 0; position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--sheet); transform: translateX(14px); transition: transform 160ms var(--ease-out); }
.switch[aria-checked="false"] { background: var(--ink-3); }
.switch[aria-checked="false"]::after { transform: none; }
.menu { position: absolute; right: 8px; top: 44px; z-index: 5; min-width: 200px; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,0.12); transform-origin: top right; animation: menuin 150ms var(--ease-out); }
@keyframes menuin { from { opacity: 0; transform: translateY(-4px) scale(0.97); } }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; background: transparent; border-radius: 10px; cursor: pointer; text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--hover); outline: none; }
.menu svg { color: var(--ink-2); }
.mif { background: var(--sheet); border-radius: var(--r-card); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.mif .row1 { display: flex; align-items: center; gap: 8px; }
.mif .swap { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.mif .arrow { color: var(--ink-3); }
.btn { height: 30px; padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-weight: 500; transition: background-color 150ms ease, transform 160ms var(--ease-out); }
.btn.primary { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.note { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--sheet); border-radius: var(--r-card); color: var(--ink-2); border: 0; width: 100%; text-align: left; cursor: pointer; }
.note b { color: var(--ink); font-weight: 500; }
.listhead { display: flex; align-items: center; gap: 8px; padding: 4px 4px 0; }
.tester { display: flex; gap: 8px; align-items: center; background: var(--sheet); border-radius: var(--r-card); padding: 6px 6px 6px 12px; }
.tester input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: var(--ink); outline: none; height: 28px; }
.lic { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; flex: none; }
.lic i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.lic.free { color: var(--free); }
.lic.free i { background: var(--free-dot); }
.lic.paid { color: var(--paid); }
.lic.paid i { background: var(--paid-dot); }
.lic.unknown i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 8px 14px; border-radius: 12px; font-size: 12.5px; z-index: 20; animation: toastin 200ms var(--ease-out); white-space: nowrap; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } }

/* Version 1: Specimen. The font drawn large, one meta line, quiet icon actions. */
.v-spec { display: flex; flex-direction: column; gap: 8px; }
.v-spec .card { background: var(--sheet); border-radius: var(--r-card); padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; border: 0; text-align: left; width: 100%; transition: background-color 150ms ease; }
@media (hover: hover) and (pointer: fine) { .v-spec .card:hover { background: var(--hover); } }
.v-spec .top { display: flex; align-items: baseline; gap: 8px; }
.v-spec .name { font-weight: 500; font-size: 13px; flex: 1; min-width: 0; }
.v-spec .spec { font-size: 30px; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; padding: 4px 0; }
.v-spec .meta { color: var(--ink-2); font-size: 12px; }
.v-spec .acts { display: flex; align-items: center; gap: 2px; margin: 0 -6px; }
.v-spec .acts .grow { flex: 1; }
.v-spec .open { color: var(--ink-3); font-size: 12px; display: inline-flex; align-items: center; gap: 2px; padding-right: 4px; }

/* Version 2: Index. One row per font, its name set in the font itself; actions on hover or focus. */
.v-index { background: var(--sheet); border-radius: var(--r-card); overflow: hidden; }
.v-index .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 10px 8px 10px 14px; border-top: 1px solid var(--line); cursor: pointer; position: relative; }
.v-index .row:first-child { border-top: 0; }
@media (hover: hover) and (pointer: fine) { .v-index .row:hover { background: var(--hover); } }
.v-index .nm { font-size: 21px; line-height: 1.2; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.v-index .meta { grid-column: 1; color: var(--ink-2); font-size: 12px; }
.v-index .right { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 4px; }
.v-index .acts { display: flex; gap: 0; opacity: 0; transition: opacity 150ms ease; }
.v-index .row:hover .acts, .v-index .row:focus-within .acts { opacity: 1; }
@media (hover: none) { .v-index .acts { opacity: 1; } }
.v-index .chev { color: var(--ink-3); display: inline-flex; }
.v-index .sample { grid-column: 1 / -1; color: var(--ink-2); font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* Version 3: Proof. A proof sheet: specimen on the right, measured facts in a mono column, text-link actions. */
.v-proof { display: flex; flex-direction: column; gap: 8px; }
.v-proof .card { background: var(--sheet); border-radius: var(--r-card); padding: 0; cursor: pointer; overflow: hidden; }
.v-proof .head { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 0; }
.v-proof .idx { font: 12px var(--mono); color: var(--ink-3); }
.v-proof .name { font-weight: 500; flex: 1; min-width: 0; }
.v-proof .body { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 10px 14px 12px; }
.v-proof dl { margin: 0; display: grid; grid-template-columns: 1fr; gap: 6px; align-content: start; }
.v-proof dt { font: 11px var(--mono); color: var(--ink-3); }
.v-proof dd { margin: 0; font-size: 12px; color: var(--ink); }
.v-proof .aa { font-size: 64px; line-height: 0.95; border-left: 1px solid var(--line); padding-left: 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; min-width: 0; }
.v-proof .aa small { font-size: 15px; line-height: 1.3; color: var(--ink-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.v-proof .links { display: flex; gap: 16px; padding: 10px 14px; border-top: 1px solid var(--line); }
.v-proof .links button { border: 0; background: none; padding: 0; color: var(--ink-2); cursor: pointer; font-size: 12.5px; }
.v-proof .links button:hover, .v-proof .links button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.v-proof .links .grow { flex: 1; }
.v-proof .links .open { color: var(--ink); font-weight: 500; }

/* Version 4: Specimen+. Numbered like a proof, the pangram drawn large, actions that say what they do. */
.v-plus { display: flex; flex-direction: column; gap: 8px; }
.v-plus .card { background: var(--sheet); border-radius: var(--r-card); padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: background-color 150ms ease; }
@media (hover: hover) and (pointer: fine) { .v-plus .card:hover { background: var(--hover); } }
.v-plus .top { display: flex; align-items: baseline; gap: 8px; }
.v-plus .idx { font: 12px var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.v-plus .name { font-weight: 500; font-size: 13px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.v-plus .spec { font-size: 30px; line-height: 1.15; overflow-wrap: anywhere; padding: 2px 0; }
.v-plus .meta { color: var(--ink-2); font-size: 12px; }
.v-plus .acts { display: flex; align-items: center; gap: 0; margin: 0 -6px; flex-wrap: nowrap; border-top: 1px solid var(--line); padding-top: 6px; }
.v-plus .act { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 6px; white-space: nowrap; flex: none; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--ink-2); cursor: pointer; font-size: 12.5px; transition: background-color 150ms ease, color 150ms ease, transform 160ms var(--ease-out); }
.v-plus .act:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .v-plus .act:hover { background: var(--hover); color: var(--ink); } }
.v-plus .act[aria-pressed="true"] { color: var(--ink); }
.v-plus .act:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.v-plus .grow { flex: 1; }
.v-plus .open { color: var(--ink); font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 2px; padding-right: 4px; white-space: nowrap; flex: none; }
@media (max-width: 360px) { .v-plus .act .lbl-long { display: none; } }

/* Version 5: Quiet. Icons only, in the name row, with a label on hover or keyboard focus. */
.v-quiet { display: flex; flex-direction: column; gap: 8px; }
.v-quiet .card { background: var(--sheet); border-radius: var(--r-card); padding: 10px 10px 14px 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: background-color 150ms ease; }

.v-quiet .top { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.v-quiet .idx { font: 12px var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.v-quiet .name { font-weight: 500; font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.v-quiet .grow { flex: 1; }
.v-quiet .tools { display: flex; gap: 0; color: var(--ink-3); }
.v-quiet .tools .iconbtn { color: var(--ink-3); }
@media (hover: hover) and (pointer: fine) { .v-quiet .card:hover .tools .iconbtn, .v-quiet .tools .iconbtn:focus-visible { color: var(--ink-2); } }
.v-quiet .tools .iconbtn[aria-pressed="true"] { color: var(--ink); background: transparent; }
.v-quiet .spec { font-size: 30px; line-height: 1.15; overflow-wrap: anywhere; padding-right: 4px; }
.v-quiet .meta { color: var(--ink-3); font-size: 12px; display: flex; align-items: center; gap: 4px; padding-right: 4px; }
.v-quiet .meta svg { margin-left: auto; color: var(--ink-3); }
/* Tooltip: names the icon on hover or focus; from the button, short and quick. */
.tip { position: relative; }
.tip::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translate(-50%, 2px); transform-origin: bottom center; background: var(--ink); color: var(--sheet); font: 500 11.5px/1 var(--ui); padding: 6px 8px; border-radius: 9px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 120ms ease-out, transform 160ms var(--ease-out); z-index: 4; }
.tip:hover::after, .tip:focus-visible::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 250ms; }
.tools:hover .tip:hover::after { transition-delay: 0ms; }

/* Version 6: Stacked. Icon above a small label, in a slim row. */
.v-stack .acts { display: grid; grid-template-columns: repeat(3, auto) 1fr; gap: 0 4px; margin: 2px -6px 0; align-items: end; }
.v-stack .act { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; border: 0; background: transparent; border-radius: var(--r-ctl); color: var(--ink-3); font-size: 10.5px; cursor: pointer; transition: background-color 150ms ease, color 150ms ease, transform 160ms var(--ease-out); }
.v-stack .act svg { width: 16px; height: 16px; flex: none; }
.v-stack .act { height: auto; }
.v-stack .act:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .v-stack .act:hover { background: var(--hover); color: var(--ink); } }
.v-stack .act[aria-pressed="true"] { color: var(--ink); }
.v-stack .act:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.v-stack .chev { justify-self: end; color: var(--ink-3); padding: 0 6px 8px 0; display: inline-flex; }

/* Page v2: the whole Page tab with room to breathe. One spacing scale: 16 between boxes, 16/18 inside, 12 between lines of a box. */
body[data-full] .chrome { display: none; }
body[data-full] .panel { padding: 0; gap: 0; }
.p2 { display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 120px; }
.p2 .topbar { margin-bottom: 4px; }
.p2 h2 { margin: 0; font: 500 14px/1.3 var(--ui); color: var(--ink); }
.p2 .box { background: var(--sheet); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.p2 .hair { height: 1px; background: var(--line); margin: 0 -18px; }
.p2 .st1 { display: flex; align-items: flex-start; gap: 12px; }
.p2 .st1 .live { margin-top: 5px; }
.p2 .st1 .label, .p2 .st1 .switch { align-self: center; }
.p2 .st1 .who { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.p2 .st1 .who span { font-size: 12px; color: var(--ink-3); }
.p2 .st1 .who b { font-size: 14px; font-weight: 500; }
.p2 .st2 { display: flex; align-items: center; gap: 4px; }
.p2 .st2 .btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; }
.p2 .st2 .btn.primary svg { color: var(--sheet); }
.p2 .st2 .btn.primary { min-width: 140px; justify-content: center; }
.p2 .st2 .grow { flex: 1; }
.p2 .t1 { display: flex; align-items: center; gap: 10px; color: var(--ink-3); }
.p2 .t1 input[type=text] { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 13px; color: var(--ink); outline: none; height: 28px; }
.p2 .t1 input[type=text]::placeholder { color: var(--ink-3); }
.p2 .dd { position: relative; flex: none; }
.p2 .ddbtn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: 10px; background: var(--field); color: var(--ink); font: 12.5px var(--ui); cursor: pointer; transition: background-color 150ms ease, transform 160ms var(--ease-out); }
.p2 .ddbtn > svg:first-child { color: var(--ink-2); }
.p2 .ddbtn:active { transform: scale(0.97); }
.p2 .ddbtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.p2 .ddbtn .chev { display: inline-flex; color: var(--ink-2); transition: transform 200ms var(--ease-out); }
.p2 .ddbtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.p2 .ddlist { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; min-width: 168px; max-height: 280px; overflow: auto; margin: 0; padding: 4px; list-style: none; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,0.14); transform-origin: top right; animation: menuin 150ms var(--ease-out); }
.p2 .ddlist li { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 32px; padding: 0 10px; border-radius: 10px; cursor: pointer; font-size: 13px; color: var(--ink); outline: none; }
.p2 .ddlist li:hover, .p2 .ddlist li:focus { background: var(--hover); }
.p2 .ddlist li .tick { display: inline-flex; color: var(--ink); visibility: hidden; }
.p2 .ddlist li[aria-selected="true"] .tick { visibility: visible; }
.p2 .langpick { position: relative; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border-radius: 10px; color: var(--ink-2); background: var(--field); cursor: pointer; }
.p2 .langpick select { -webkit-appearance: none; appearance: none; border: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--ink); outline: none; cursor: pointer; padding: 0 16px 0 0; margin-right: -16px; field-sizing: content; }
.p2 .langpick select option { color: #141413; }
.p2 .langpick > svg:last-child { pointer-events: none; color: var(--ink-2); }
.p2 .langpick:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.p2 .t1 .px { font: 12px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; width: 36px; text-align: right; }
.p2 .t1 input[type=range] { width: 64px; accent-color: var(--ink); flex: none; }
.p2 .t2 { display: flex; align-items: center; gap: 2px; }
.p2 .seg { border: 0; background: transparent; height: 28px; padding: 0 8px; border-radius: 10px; color: var(--ink-3); cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.p2 .seg[aria-pressed="true"] { color: var(--ink); background: var(--field); }
.p2 .seg:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.p2 .t2 .grow { flex: 1; }
.p2 .mf .info { margin: 0; color: var(--ink-2); font-size: 13px; background: var(--field); border-radius: 12px; padding: 10px 12px; }
.p2 .mfrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 10px; align-items: baseline; padding: 2px 0; }
.p2 .mfrow .from { color: var(--ink-2); overflow-wrap: anywhere; }
.p2 .mfrow .to { color: var(--ink-3); font-size: 12px; }
.p2 .mfrow .got { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; text-align: right; min-width: 0; }
.p2 .mfrow .got b { font-weight: 500; }
.p2 .mfrow .got b span { font: 12px var(--mono); color: var(--ink-3); margin-left: 6px; }
.p2 .mfrow .got .lic { display: block; white-space: normal; text-align: right; line-height: 1.4; }
.p2 .mfrow .got .lic i { display: inline-block; margin-right: 6px; vertical-align: 1px; }
.p2 .mflist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.p2 .mflist li { display: grid; grid-template-columns: 4px minmax(0, 1fr) 16px minmax(0, 1fr); align-items: center; gap: 10px; font-size: 14px; }
.p2 .mflist li::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); }

const TICK = ICON.Tick02Icon;
// Copy buttons say so: a tick and "Copied" for a moment, then back.
function copied(btn) {
  if (btn.dataset.busy) return;
  btn.dataset.busy = '1';
  const html = btn.innerHTML, tip = btn.dataset.tip, label = btn.getAttribute('aria-label');
  const iconOnly = btn.classList.contains('iconbtn');
  btn.innerHTML = TICK + (iconOnly ? '' : '<span>Copied</span>');
  if (tip) btn.dataset.tip = 'Copied';
  if (label) btn.setAttribute('aria-label', 'Copied');
  btn.classList.add('copied');
  setTimeout(() => { btn.innerHTML = html; if (tip) btn.dataset.tip = tip; if (label) btn.setAttribute('aria-label', label); btn.classList.remove('copied'); delete btn.dataset.busy; }, 1600);
}
document.addEventListener('click', (e) => {
  const c = e.target.closest('[data-copy]');
  if (c) { e.preventDefault(); e.stopImmediatePropagation(); copied(c); if (c.dataset.copyNote) toast(c.dataset.copyNote); }
}, true);

let toastTimer;
function toast(m) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.textContent = m;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2200);
}
function rerender() { stage.innerHTML = variants[current](); }

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (a) {
    e.stopPropagation();
    const f = a.dataset.f;
    if (a.dataset.act === 'save') { st.saved.has(f) ? st.saved.delete(f) : st.saved.add(f); toast(st.saved.has(f) ? `Saved ${f} to your library` : `Removed ${f} from your library`); }
    if (a.dataset.act === 'css') toast(`Copied CSS for ${f}`);
    if (a.dataset.act === 'show') { st.shown = st.shown === f ? null : f; toast(st.shown ? `Outlined ${f === 'Lobster' ? '1 element' : 'every element'} in ${f}` : 'Outlines removed'); }
    rerender();
    return;
  }
  const o = e.target.closest('[data-open]');
  if (o) { toast(`Opens Details for ${o.dataset.open}`); return; }
  const t = e.target.closest('[data-toast]');
  if (t) { toast(t.dataset.toast); closeMenu(); return; }
  if (e.target.closest('#more')) { const m = document.getElementById('menu'); const open = m.hidden; m.hidden = !open; document.getElementById('more').setAttribute('aria-expanded', String(open)); if (open) m.querySelector('button').focus(); return; }
  if (!e.target.closest('#menu')) closeMenu();
  if (e.target.closest('#sw')) { const s = document.getElementById('sw'); s.setAttribute('aria-checked', String(s.getAttribute('aria-checked') !== 'true')); }
  if (e.target.closest('#aa')) { const b = document.getElementById('aa'); const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); document.getElementById('tester').hidden = !on; if (on) document.getElementById('tt').focus(); else { st.text = ''; document.getElementById('tt').value = ''; rerender(); } }
  if (e.target.closest('#ttx')) { st.text = ''; document.getElementById('tt').value = ''; rerender(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeMenu();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open]')) { e.preventDefault(); toast(`Opens Details for ${e.target.dataset.open}`); }

function ddOpen(open) {
  const b = document.getElementById('ddbtn'), l = document.getElementById('ddlist');
  if (!b || !l) return;
  b.setAttribute('aria-expanded', String(open));
  l.hidden = !open;
  if (open) (l.querySelector('[aria-selected="true"]') || l.firstElementChild).focus();
}
function ddPick(k) {
  st.lang = k; st.text = '';
  const ti = document.getElementById('t2'); if (ti) ti.value = '';
  document.querySelectorAll('.v7spec').forEach((n) => (n.textContent = LANGS[k][1]));

  document.querySelectorAll('#ddlist li').forEach((li) => li.setAttribute('aria-selected', String(li.dataset.lang === k)));
  ddOpen(false); b.focus();
}
document.addEventListener('click', (e) => {
  if (e.target.closest('#ddbtn')) { e.stopPropagation(); ddOpen(document.getElementById('ddlist').hidden); return; }
  const li = e.target.closest('#ddlist li');
  if (li) { e.stopPropagation(); ddPick(li.dataset.lang); return; }
  if (!e.target.closest('.dd')) ddOpen(false);
}, true);
document.addEventListener('keydown', (e) => {
  const l = document.getElementById('ddlist');
  if (!l) return;
  if (e.target.id === 'ddbtn' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); ddOpen(true); return; }
  if (!l.hidden && e.target.closest('#ddlist')) {
    const items = [...l.children], i = items.indexOf(e.target);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[Math.min(items.length - 1, i + 1)].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[Math.max(0, i - 1)].focus(); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ddPick(e.target.dataset.lang); }
    else if (e.key === 'Escape' || e.key === 'Tab') { ddOpen(false); document.getElementById('ddbtn').focus(); }
    e.stopPropagation();
  }
}, true);
function closeMenu() { const m = document.getElementById('menu'); if (!m.hidden) { m.hidden = true; document.getElementById('more').setAttribute('aria-expanded', 'false'); } }
document.getElementById('tt').addEventListener('input', (e) => { st.text = e.target.value; rerender(); });

// Picker wiring (verbatim behaviour)
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => { stage.innerHTML = variants[i](); }); }
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
  moveHighlight();
  document.body.toggleAttribute('data-full', i === variants.length - 1);
  try { const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url); } catch (err) {}
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
let requested = 7;
try { requested = parseInt(new URLSearchParams(location.search).get('v'), 10) || requested; } catch (err) {}
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
