<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Font Finder Plus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,600&family=Lobster&display=swap">
<style>
:root {
  --desk: #e5e5e5; --bg: #f2f2f2; --sheet: #ffffff; --ink: #171717; --ink-2: #525252; --ink-3: #737373;
  --line: rgba(0,0,0,0.08); --field: #f2f2f2; --hover: #e5e5e5; --field-2: #e5e5e5;
  --free: #0b7a37; --free-dot: #19a35a; --paid: #8a5a00; --paid-dot: #e39b12;
  --ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --r-card: 18px; --r-ctl: 11px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #050505; --bg: #0d0d0d; --sheet: #171717; --ink: #f2f2f2; --ink-2: #a3a3a3; --ink-3: #8a8a8a;
  --line: rgba(255,255,255,0.08); --field: #262626; --hover: #333333; --field-2: #333333;
  --free: #6be29c; --free-dot: #3ad47a; --paid: #f2be6b; --paid-dot: #e39b12; color-scheme: dark; } }
:root[data-theme="dark"] {
  --desk: #050505; --bg: #0d0d0d; --sheet: #171717; --ink: #f2f2f2; --ink-2: #a3a3a3; --ink-3: #8a8a8a;
  --line: rgba(255,255,255,0.08); --field: #262626; --hover: #333333; --field-2: #333333;
  --free: #6be29c; --free-dot: #3ad47a; --paid: #f2be6b; --paid-dot: #e39b12; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 13px/1.45 var(--ui); -webkit-font-smoothing: antialiased; }
.desk { min-height: 100vh; display: flex; justify-content: center; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.panel { width: 400px; max-width: 100%; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 120px; }
button { font: inherit; color: inherit; }
h2 { margin: 0; font: 500 14px/1.3 var(--ui); }
p { margin: 0; }
.box { background: var(--sheet); border-radius: var(--r-card); padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.faint { color: var(--ink-3); }
.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.brand { font-weight: 600; font-size: 13px; padding: 0 4px; }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--sheet); border-radius: 13px; flex: 1; }
.tabs button { flex: 1; height: 28px; border: 0; background: transparent; border-radius: 10px; color: var(--ink-2); cursor: pointer; }
.tabs button[aria-current] { background: var(--field); color: var(--ink); }
.iconbtn { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--ink-3); cursor: pointer; flex: none; transition: background-color 150ms ease, color 150ms ease, transform 160ms var(--ease-out); }
@media (hover: hover) and (pointer: fine) { .iconbtn:hover { background: var(--hover); color: var(--ink); } }
.iconbtn[aria-pressed="true"] { color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: var(--r-ctl); border: 0; background: var(--field); cursor: pointer; font-weight: 500; color: var(--ink); white-space: nowrap; text-decoration: none; transition: background-color 150ms ease, opacity 150ms ease, transform 160ms var(--ease-out); }
.btn.primary { background: var(--ink); color: var(--sheet); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
@media (hover: hover) and (pointer: fine) { .btn:not(.primary):hover { background: var(--field-2); } .btn.primary:hover { opacity: 0.88; } }
.on-grey .btn:not(.primary) { background: var(--sheet); }
@media (hover: hover) and (pointer: fine) { .on-grey .btn:not(.primary):hover { background: var(--hover); } }
.iconbtn:active, .btn:active { transform: scale(0.97); }
:is(.iconbtn, .btn, .tabs button, .row, .link, .chip):focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.link { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; color: var(--ink-2); font-weight: 500; font-size: 12.5px; cursor: pointer; text-decoration: none; }
.link:hover { color: var(--ink); }
.lic { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; flex: none; }
.lic i { width: 6px; height: 6px; border-radius: 50%; }
.lic.free { color: var(--free); } .lic.free i { background: var(--free-dot); }
.lic.paid { color: var(--paid); } .lic.paid i { background: var(--paid-dot); }
.lic.unknown { color: var(--ink-3); } .lic.unknown i { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.tip { position: relative; }
.tip::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translate(-50%, 2px); background: var(--ink); color: var(--sheet); font: 500 11.5px/1 var(--ui); padding: 6px 8px; border-radius: 9px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 120ms ease-out, transform 160ms var(--ease-out); z-index: 4; }
.tip:hover::after, .tip:focus-visible::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 250ms; }
.toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 8px 14px; border-radius: 12px; font-size: 12.5px; z-index: 20; animation: toastin 200ms var(--ease-out); white-space: nowrap; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }


/* System tab. Same tokens as Page v2, Details and Image. The health check and readability keep the old colour language. */
:root { --inset: #f8f8f8; --g: #19c05a; --g-text: #0b7a37; --g-soft: #e3f6ea; --a: #e39b12; --a-text: #7a4e00; --a-soft: #fbefd9; --r: #d92d20; --r-text: #b42318; --r-soft: #fdecea; --bad: #b42318; --bad-dot: #e5484d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --inset: #212121; --g: #3ad47a; --g-text: #6be29c; --g-soft: rgba(58,212,122,0.14); --a: #f2b04a; --a-text: #f2be6b; --a-soft: rgba(242,176,74,0.14); --r: #f0605a; --r-text: #ff8a80; --r-soft: rgba(240,96,90,0.16); --bad: #ff8a80; } }
:root[data-theme="dark"] { --inset: #212121; --g: #3ad47a; --g-text: #6be29c; --g-soft: rgba(58,212,122,0.14); --a: #f2b04a; --a-text: #f2be6b; --a-soft: rgba(242,176,74,0.14); --r: #f0605a; --r-text: #ff8a80; --r-soft: rgba(240,96,90,0.16); --bad: #ff8a80; }
.sechead { display: flex; align-items: baseline; gap: 8px; }
.sechead .count { color: var(--ink-3); font-size: 12px; }
.sechead .grow { flex: 1; }
.sub { font-size: 12.5px; color: var(--ink-3); }
.hair { border-top: 1px solid var(--line); }

/* Health: the old card. A score box, coloured bars, pills for each finding. */
.score { display: flex; align-items: center; gap: 14px; }
.score .num { display: flex; align-items: baseline; gap: 2px; padding: 10px 14px; border-radius: 16px; background: var(--inset); flex: none; }
.score .num b { font: 600 30px/1 var(--ui); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.score .num small { font-size: 12px; color: var(--ink-3); }
.score .num.good b { color: var(--g-text); } .score .num.warn b { color: var(--a-text); } .score .num.bad b { color: var(--r-text); }
.score .txt { display: flex; flex-direction: column; gap: 2px; }
.score .txt b { font-weight: 500; font-size: 15px; }
.parts { display: flex; flex-direction: column; }
.part { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 1fr 90px 30px 14px; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.part:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
@media (hover: hover) and (pointer: fine) { .part:hover .lbl { color: var(--ink); } }
.part .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12.5px; }
.part .chev { display: inline-flex; color: var(--ink-3); transition: transform 200ms var(--ease-out); }
.part[aria-expanded="true"] .chev { transform: rotate(180deg); }
.bar { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.bar i.good { background: var(--g); } .bar i.warn { background: var(--a); } .bar i.bad { background: var(--r); }
.finds { display: flex; flex-direction: column; gap: 12px; padding: 8px 0 14px; animation: fadein 200ms var(--ease-out); }
.find { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; }
.find > span:last-child { flex: 1; padding-top: 1px; }
.pill { flex: none; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; line-height: 1.5; background: var(--field); color: var(--ink-3); }
.pill.bad { background: var(--r-soft); color: var(--r-text); }
.pill.warn { background: var(--a-soft); color: var(--a-text); }
.pill.good { background: var(--g-soft); color: var(--g-text); }
.on-grey .pill:not(.bad):not(.warn):not(.good) { background: var(--sheet); }

/* Type styles */
.scale { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: var(--inset); border-radius: 14px; font-size: 12.5px; }
.scale b { font-weight: 500; }
.scale .sizes { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.styles { display: flex; flex-direction: column; }
.style { display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-top: 1px solid var(--line); }
.style:first-child { border-top: 0; padding-top: 4px; }
.style .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tag { font: 500 11.5px var(--ui); padding: 3px 7px; border-radius: 8px; background: var(--field); color: var(--ink-2); flex: none; }
.style .who { font-size: 12.5px; color: var(--ink-2); flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.style .sample { line-height: 1.15; overflow-wrap: anywhere; color: var(--ink); }
.style .meta { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.copied { color: var(--ink) !important; }

/* Readability: a main card with a card for each issue, as before. */
.issues { display: flex; flex-direction: column; gap: 8px; }
.issue { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 14px; background: var(--inset); }
.issue .top { display: flex; align-items: flex-start; gap: 8px; }
.issue .top b { font-weight: 500; flex: 1; }
.issue .top b span { color: var(--ink-3); font-weight: 400; }
.issue p { font-size: 12.5px; color: var(--ink-2); }
.issue .quote { font-size: 12.5px; color: var(--ink-3); font-style: italic; }
.issue .btn { align-self: flex-start; margin-top: 6px; }
.readnote { font-size: 12px; color: var(--ink-3); }

/* Fonts and loading */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--inset); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat span { font-size: 12px; color: var(--ink-3); }
.stat b { font-weight: 500; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tips { display: flex; flex-direction: column; gap: 12px; margin: 8px 0; }
.famsbox { background: var(--inset); border-radius: 14px; overflow: hidden; }
.famhead { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer; font-weight: 500; }
.famhead .count { color: var(--ink-3); font-weight: 400; font-size: 12px; }
.famhead .grow { flex: 1; }
.famhead .chev { display: inline-flex; color: var(--ink-3); transition: transform 200ms var(--ease-out); }
.famhead[aria-expanded="true"] .chev { transform: rotate(180deg); }
.famhead:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 14px; }
.fams { display: flex; flex-direction: column; margin: 0 6px 6px; padding: 2px 12px; background: var(--sheet); border-radius: 11px; animation: fadein 200ms var(--ease-out); }
.fam { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.fam:first-child { border-top: 0; }
.fam b { font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.fam .r { color: var(--ink-3); font-variant-numeric: tabular-nums; text-align: right; }
.fam .d { grid-column: 1 / -1; color: var(--ink-3); font-size: 12px; }
.disc { all: unset; display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); font-weight: 500; font-size: 12.5px; cursor: pointer; }
.disc .chev { display: inline-flex; transition: transform 200ms var(--ease-out); }
.disc[aria-expanded="true"] .chev { transform: rotate(180deg); }
.disc:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }

/* Take it with you: Figma and export */
.figrow { display: flex; flex-direction: column; gap: 12px; padding: 14px; background: var(--inset); border-radius: 14px; }
.figrow .btn { width: 100%; }
.figrow .t { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.figrow .t b { font-weight: 500; }
.figrow .t span { font-size: 12px; color: var(--ink-3); }
.fmt { display: flex; gap: 6px; flex-wrap: wrap; }
.fmt .chip { height: 30px; }
.chip { height: 28px; padding: 0 10px; border-radius: 10px; border: 0; background: var(--field); cursor: pointer; font-size: 12.5px; color: var(--ink-2); transition: background-color 150ms ease, transform 160ms var(--ease-out); }
@media (hover: hover) and (pointer: fine) { .chip:not([aria-pressed="true"]):hover { background: var(--field-2); } }
.chip:active { transform: scale(0.97); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.code { margin: 0; background: var(--inset); border-radius: 14px; padding: 12px 14px; font: 12px/1.6 var(--mono); color: var(--ink-2); overflow: auto; max-height: 188px; white-space: pre; }
.code .c { color: var(--ink-3); }
.exacts { display: flex; gap: 8px; }
.exnote { font-size: 12px; color: var(--ink-3); }

/* Compare */
.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.cmp td { padding: 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
.cmp td:first-child { color: var(--ink-3); width: 30%; }
.cmp { margin-top: 8px; table-layout: fixed; }
.cmp th { text-align: left; font-weight: 500; font-size: 12px; color: var(--ink-2); padding: 0 0 8px; }
.cmp td { padding: 8px 8px 8px 0; }
.cmp td svg { vertical-align: -3px; }

/* Floating section tabs, as in Details. */
.floatnav { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; display: flex; padding: 4px; border-radius: 14px; background: var(--sheet); border: 1px solid var(--line); box-shadow: 0 10px 28px rgba(0,0,0,0.14), 0 2px 6px rgba(0,0,0,0.06); max-width: calc(min(400px, 100vw) - 24px); }
.floatnav .hl { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 10px; background: var(--ink); transition: transform 250ms var(--ease-out), width 250ms var(--ease-out); }
.floatnav button { position: relative; border: 0; background: transparent; height: 28px; padding: 0 10px; border-radius: 10px; color: var(--ink-2); font: 500 12.5px var(--ui); cursor: pointer; white-space: nowrap; transition: color 150ms ease; }
.floatnav button[aria-current="true"] { color: var(--sheet); }
.floatnav button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (hover: hover) and (pointer: fine) { .floatnav button:not([aria-current="true"]):hover { color: var(--ink); } }
.again { align-self: center; margin-top: 4px; }

/* Version 2: Tabs. One subject at a time. */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 3px; background: var(--sheet); border-radius: 13px; }
.seg button { height: 28px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 12.5px; }
.seg button[aria-current] { background: var(--field); color: var(--ink); }
.seg button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.pagehead { display: flex; align-items: center; gap: 10px; padding: 4px 6px 0; }
.pagehead .site { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pagehead .site b { font-weight: 500; }
.pagehead .site span { font-size: 12px; color: var(--ink-3); }

/* Version 3: Summary. A short summary; each row opens its own page. */
.rows { display: flex; flex-direction: column; margin: 0 -8px; }
.go { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 28px 1fr auto 14px; gap: 12px; align-items: center; padding: 12px 8px; border-radius: 12px; cursor: pointer; transition: background-color 150ms ease; }
.go + .go { box-shadow: 0 -1px 0 var(--line); }
@media (hover: hover) and (pointer: fine) { .go:hover { background: var(--field); box-shadow: none; } .go:hover + .go { box-shadow: none; } }
.go:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.go .ic { width: 28px; height: 28px; border-radius: 10px; background: var(--field); display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); }
.go .t { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.go .t b { font-weight: 500; }
.go .t span { font-size: 12px; color: var(--ink-3); }
.go .v { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.go .v.bad { color: var(--bad); }
.go .chev { color: var(--ink-3); display: inline-flex; }
.back { all: unset; display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); font-weight: 500; cursor: pointer; padding: 4px 6px; border-radius: 10px; align-self: flex-start; }
.back:hover { color: var(--ink); }
.back:focus-visible { outline: 2px solid var(--ink); }
.drill { display: flex; flex-direction: column; gap: 8px; animation: fadein 200ms var(--ease-out); }

/* Dropdown (custom listbox, as in Details) */
.dd { position: relative; }
.dd > button { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 12px; border-radius: var(--r-ctl); border: 0; background: var(--field); cursor: pointer; font-weight: 500; width: 100%; justify-content: space-between; }
.dd .chev { display: inline-flex; color: var(--ink-3); transition: transform 200ms var(--ease-out); }
.dd[data-open] .chev { transform: rotate(180deg); }
.dd ul { position: absolute; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px; list-style: none; background: var(--sheet); border-radius: 14px; box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(0,0,0,0.12); z-index: 5; transform-origin: top; animation: ddin 160ms var(--ease-out); }
@keyframes ddin { from { opacity: 0; transform: scale(0.97); } }
.dd li { padding: 8px 10px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.dd li:hover { background: var(--field); }
.dd li span { font-size: 12px; color: var(--ink-3); }

/* radius+2 */

.box[id] { scroll-margin-top: 52px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- App shell: the whole side panel, linked together ---- */
.proto-picker { display: none !important; }
.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.topbar .brand { display: none; }
.topbar .tabs { display: flex; flex: 1; gap: 2px; padding: 4px; background: var(--sheet); border-radius: 14px; }
.topbar .tabs a { flex: 1; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--ink-2); font: 500 13px var(--ui); text-decoration: none; transition: background-color 150ms ease, color 150ms ease; }
.topbar .tabs a[aria-current="page"] { background: var(--field); color: var(--ink); }
@media (hover: hover) and (pointer: fine) { .topbar .tabs a:not([aria-current]):hover { color: var(--ink); } }
.topbar .setbtn { width: 42px; height: 42px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--sheet); color: var(--ink-2); text-decoration: none; transition: color 150ms ease, transform 160ms cubic-bezier(0.23,1,0.32,1); }
.topbar .setbtn svg { width: 18px; height: 18px; }
@media (hover: hover) and (pointer: fine) { .topbar .setbtn:hover { color: var(--ink); } }
.topbar .tabs a:active, .topbar .setbtn:active { transform: scale(0.97); }
.topbar a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
/* Buttons 4px taller everywhere */
.btn { height: 38px !important; }
.btn.sm { height: 34px !important; }
.btn.wide, .btn.big { height: 44px !important; }
/* Details back button: the same white container as Library and Settings */

const st = { open: null, all: false, fams: false, fmt: 'css', dd: false, shown: null, sub: 'overview', drill: null, copied: null };

// ------------------------------------------------ building blocks
const tone = (n) => (n >= 85 ? 'good' : n >= 65 ? 'warn' : 'bad');
const PILL = { Fix: 'bad', Fails: 'bad', Check: 'warn', Tip: '', Good: 'good' };
const pill = (l) => `<span class="pill ${PILL[l]}">${l}</span>`;
const pct = (n) => `<span class="bar"><i class="${tone(n)}" style="width:${n}%"></i></span>`;
const health = (opts = {}) => `
  <section class="box" id="s-health">
    <div class="sechead" style="align-items:center"><h2>Type system check</h2><span class="grow"></span><button class="iconbtn tip" data-recheck aria-label="Check the page again" data-tip="Check the page again" style="margin:-6px -6px -6px 0">${ICON.RefreshIcon}</button></div>
    <div class="score">
      <div class="num ${tone(61)}"><b>61</b><small>/100</small></div>
      <div class="txt"><b>Fair</b><span class="sub">Fonts, sizes, weights, loading and readability, from what this page uses.</span></div>
    </div>
    <div class="parts">${PARTS.map((p) => `
      <button class="part" data-part="${p.id}" aria-expanded="${st.open === p.id}"><span class="lbl">${p.label}</span>${pct(p.score)}<span class="n">${p.score}</span><span class="chev">${ICON.ChevD}</span></button>
      ${st.open === p.id ? `<div class="finds">${p.finds.map(([l, t, x]) => `<div class="find">${pill(l)}<span>${x}</span></div>`).join('')}</div>` : ''}`).join('')}
    </div>
    ${opts.noCopy ? '' : `<div><button class="btn sm" data-copy="report">${st.copied === 'report' ? ICON.Tick02Icon + 'Copied' : ICON.CopySmall + 'Copy report'}</button></div>`}
  </section>`;

const styleRow = (s, i) => `
  <div class="style">
    <div class="top"><span class="tag">${s.tag}</span><span class="who">${s.font} · ${s.w}${s.it ? ' italic' : ''}</span>
      <button class="iconbtn tip ${st.copied === 'st' + i ? 'copied' : ''}" data-copy="st${i}" aria-label="Copy CSS for ${s.tag}" data-tip="${st.copied === 'st' + i ? 'Copied' : 'Copy CSS'}">${st.copied === 'st' + i ? ICON.Tick02Icon : ICON.Copy01Icon}</button></div>
    <div class="sample" style="font-family:${s.css};font-weight:${s.w};font-style:${s.it ? 'italic' : 'normal'};font-size:${Math.min(s.size, 36)}px;letter-spacing:${s.tr === '0' ? 'normal' : '-0.01em'}">${esc(s.sample)}</div>
    <div class="meta">${s.size}px / ${s.lh === 'normal' ? 'normal' : `${s.lh}px`} · tracking ${s.tr} · used ${s.n}×</div>
  </div>`;
const styles = () => {
  const list = st.all ? STYLES : STYLES.slice(0, 5);
  return `
  <section class="box" id="s-styles">
    <div class="sechead"><h2>Type styles</h2><span class="count">${STYLES.length}</span></div>
    <div class="scale"><span><b>Minor second scale</b> (1.067) from a 17px base</span><span class="sizes">48 · 24 · 17 · 16 · 14 px</span></div>
    <div class="styles">${list.map(styleRow).join('')}</div>
    ${STYLES.length > 5 ? `<div><button class="disc" data-all aria-expanded="${st.all}">${st.all ? 'Show fewer' : `Show ${STYLES.length - 5} more`}<span class="chev">${ICON.ChevD}</span></button></div>` : ''}
  </section>`;
};

const readability = () => `
  <section class="box" id="s-read">
    <div class="sechead"><h2>Readability</h2><span class="count">${ISSUES.length} to look at</span></div>
    <div class="issues">${ISSUES.map((x, i) => `
      <div class="issue on-grey">
        <div class="top">${pill(x.label)}<b>${x.title} <span>(${x.n})</span></b></div>
        <p>${x.detail}</p>
        <div class="quote">“${esc(x.quote)}”</div>
        <button class="btn sm" data-show="${i}">${ICON.Target02Icon}${st.shown === i ? 'Hide outlines' : 'Show on page'}</button>
      </div>`).join('')}</div>
    <p class="readnote">Checked against WCAG 2.1 AA contrast and common reading guidelines. Text on images or gradients is not checked for contrast.</p>
  </section>`;

const loading = () => `
  <section class="box" id="s-load">
    <div class="sechead"><h2>Fonts and loading</h2></div>
    <div class="stats"><div class="stat"><span>Files</span><b>5</b></div><div class="stat"><span>Size</span><b>503 KB</b></div><div class="stat"><span>Formats</span><b>WOFF2 · TTF</b></div></div>
    <div class="tips">${TIPS.map(([l, t, x]) => `<div class="find">${pill(l)}<span>${x}</span></div>`).join('')}</div>
    <div class="famsbox">
      <button class="famhead" data-fams aria-expanded="${st.fams}"><span>Each family</span><span class="count">${FAMS.length}</span><span class="grow"></span><span class="chev">${ICON.ChevD}</span></button>
      ${st.fams ? `<div class="fams">${FAMS.map(([f, r, d]) => `<div class="fam"><b>${f}</b><span class="r">${r}</span><span class="d">${d}</span></div>`).join('')}</div>` : ''}
    </div>
  </section>`;

const fmtOf = () => FORMATS.find((f) => f[0] === st.fmt);
const figma = () => `
  <div class="figrow">
    <div class="t"><b>Send to Figma</b><span>Copies 7 text styles and every font with its licence. In Figma, run the Font Finder Plus plugin and paste.</span></div>
    <button class="btn primary" data-copy="figma">${st.copied === 'figma' ? ICON.Tick02Icon + 'Copied' : ICON.FigmaIcon + 'Copy for Figma'}</button>
  </div>`;
const exporter = () => {
  const f = fmtOf();
  return `
    <div class="dd" ${st.dd ? 'data-open' : ''}>
      <button data-dd aria-haspopup="listbox" aria-expanded="${st.dd}"><span>${f[1]}</span><span class="chev">${ICON.ChevD}</span></button>
      ${st.dd ? `<ul role="listbox">${FORMATS.map((x) => `<li role="option" data-fmt="${x[0]}" aria-selected="${x[0] === st.fmt}">${x[1]}${x[0] === st.fmt ? ICON.Tick02Small : `<span>${x[2]}</span>`}</li>`).join('')}</ul>` : ''}
    </div>
    <p class="exnote">${f[3]}</p>
    <pre class="code" tabindex="0" aria-label="${f[1]} code">${CODE[st.fmt]}</pre>
    <div class="exacts">
      <button class="btn sm primary" data-copy="code">${st.copied === 'code' ? ICON.Tick02Icon + 'Copied' : ICON.CopySmall + 'Copy'}</button>
      <button class="btn sm" data-toast="Downloaded ${f[2]}">${ICON.Download01Icon}Download</button>
    </div>`;
};
const takeIt = () => `
  <section class="box" id="s-export">
    <div class="sechead"><h2>Use this type system</h2></div>
    ${figma()}
    <div class="hair"></div>
    <div class="sechead"><h2 style="font-size:13px">Export as code</h2></div>
    ${exporter()}
  </section>`;

const CMP = [
  ['Fonts', '6', '2'],
  ['Body text', 'Inter 17px / 1.6', 'Söhne 16px / 1.5'],
  ['Main heading', 'Fraunces 48px / 1.1', 'Söhne 56px / 1.05'],
  ['Text styles', '7', '5'],
  ['Size scale', '1.067, minor second', '1.25, major third'],
  ['Readability', '2 to look at', 'All clear'],
];
const CMPF = [['Fraunces', 1, 0], ['Inter', 1, 0], ['Lobster', 1, 0], ['Demo Regular', 1, 0], ['Söhne', 0, 1], ['Söhne Mono', 0, 1]];
const compare = () => `
  <section class="box" id="s-compare" style="gap:8px">
    <div class="sechead"><h2>Compare with another tab</h2></div>
    <p class="sub">Puts this page's type next to another site you have open. Open Font Finder Plus on that tab once and it shows up here.</p>
    <div class="dd" style="margin-top:8px"><button data-toast="Pick another open tab"><span style="display:flex;gap:6px;align-items:center;min-width:0"><span class="faint" style="font-weight:400">With</span>stripe.com</span><span class="chev">${ICON.ChevD}</span></button></div>
    <table class="cmp"><thead><tr><th></th><th>This page</th><th>stripe.com</th></tr></thead><tbody>
      ${CMP.map(([k, a, b]) => `<tr><td>${k}</td><td>${a}</td><td>${b}</td></tr>`).join('')}
    </tbody></table>
    <table class="cmp"><thead><tr><th>Font</th><th>This page</th><th>stripe.com</th></tr></thead><tbody>
      ${CMPF.map(([f, a, b]) => `<tr><td style="color:var(--ink)">${f}</td><td>${a ? ICON.Tick02Small : '<span class="faint">–</span>'}</td><td>${b ? ICON.Tick02Small : '<span class="faint">–</span>'}</td></tr>`).join('')}
    </tbody></table>
  </section>`;

// ------------------------------------------------ the three versions
const NAV = [['s-health', 'Health'], ['s-styles', 'Styles'], ['s-read', 'Readability'], ['s-load', 'Fonts'], ['s-export', 'Export']];
const v1 = () => `
  ${health()}${styles()}${readability()}${loading()}${takeIt()}${compare()}
  <nav class="floatnav" id="floatnav" aria-label="Sections"><span class="hl" aria-hidden="true"></span>${NAV.map(([id, l]) => `<button data-jump="${id}" aria-current="false">${l}</button>`).join('')}</nav>`;
const variants = [v1];
let current = 0, navLock = null;

// ------------------------------------------------ behaviour
let toastTimer, copyTimer;
function toast(m) { document.querySelector('.toast')?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2200); }
function rerender() { const y = scrollY; stage.innerHTML = variants[current](); scrollTo(0, y); navSync(true); }
document.addEventListener('click', (e) => {
  const q = (s) => e.target.closest(s);
  if (!q('.dd') && st.dd) { st.dd = false; rerender(); }
  let el;
  if ((el = q('[data-part]'))) { st.open = st.open === el.dataset.part ? null : el.dataset.part; rerender(); return; }
  if (q('[data-all]')) { st.all = !st.all; rerender(); return; }
  if (q('[data-fams]')) { st.fams = !st.fams; rerender(); return; }
  if (q('[data-dd]')) { st.dd = !st.dd; rerender(); return; }
  if ((el = q('[data-fmt]'))) { st.fmt = el.dataset.fmt; st.dd = false; rerender(); return; }
  if ((el = q('[data-show]'))) { const i = +el.dataset.show; st.shown = st.shown === i ? null : i; if (st.shown != null) toast('Outlined on the page'); rerender(); return; }
  if ((el = q('[data-copy]'))) { st.copied = el.dataset.copy; rerender(); clearTimeout(copyTimer); copyTimer = setTimeout(() => { st.copied = null; rerender(); }, 1600); return; }
  if ((el = q('[data-jump]'))) { navLock = { k: el.dataset.jump, until: Date.now() + 900 }; navSync(true); document.getElementById(el.dataset.jump)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); return; }
  if ((el = q('[data-sub]'))) { st.sub = el.dataset.sub; rerender(); scrollTo(0, 0); return; }
  if ((el = q('[data-drill]'))) { st.drill = el.dataset.drill; rerender(); scrollTo(0, 0); return; }
  if (q('[data-back]')) { st.drill = null; rerender(); scrollTo(0, 0); return; }
  if ((el = q('[data-jump]'))) { document.getElementById(el.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (q('[data-recheck]')) { const b = q('[data-recheck]').querySelector('svg'); b.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(360deg)' }], { duration: 500, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }); toast('Checked the page again'); return; }
  if ((el = q('[data-toast]'))) { toast(el.dataset.toast); }
});
// Floating tabs follow the scroll
function navSync(force) {
  const nav = document.getElementById('floatnav'); if (!nav) return;
  const line = innerHeight * 0.33;
  let cur = NAV[0][0];
  for (const [id] of NAV) { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top <= line) cur = id; }
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = NAV[NAV.length - 1][0];
  if (navLock && Date.now() < navLock.until) cur = navLock.k;
  if (cur === nav.dataset.cur && !force) return;
  nav.dataset.cur = cur;
  nav.querySelectorAll('button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.jump === cur)));
  const b = nav.querySelector(`[data-jump="${cur}"]`), hl = nav.querySelector('.hl');
  hl.style.width = b.offsetWidth + 'px'; hl.style.transform = `translateX(${b.offsetLeft}px)`;
}
addEventListener('scroll', () => navSync(false), { passive: true });
const stage = document.getElementById('stage');
stage.innerHTML = v1(); requestAnimationFrame(() => navSync(true));

</script>

(() => {
  const CUR = "system";
  const TABS = [['page', 'Page', 'index.html'], ['image', 'Image', 'image.html'], ['system', 'System', 'system.html'], ['library', 'Library', 'library.html']];
  const GEAR = "<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M15.5 12C15.5 13.933 13.933 15.5 12 15.5C10.067 15.5 8.5 13.933 8.5 12C8.5 10.067 10.067 8.5 12 8.5C13.933 8.5 15.5 10.067 15.5 12Z\" stroke=\"currentColor\" stroke-width=\"1.5\"></path><path d=\"M21.011 14.0965C21.5329 13.9558 21.7939 13.8854 21.8969 13.7508C22 13.6163 22 13.3998 22 12.9669V11.0332C22 10.6003 22 10.3838 21.8969 10.2493C21.7938 10.1147 21.5329 10.0443 21.011 9.90358C19.0606 9.37759 17.8399 7.33851 18.3433 5.40087C18.4817 4.86799 18.5509 4.60156 18.4848 4.44529C18.4187 4.28902 18.2291 4.18134 17.8497 3.96596L16.125 2.98673C15.7528 2.77539 15.5667 2.66972 15.3997 2.69222C15.2326 2.71472 15.0442 2.90273 14.6672 3.27873C13.208 4.73448 10.7936 4.73442 9.33434 3.27864C8.95743 2.90263 8.76898 2.71463 8.60193 2.69212C8.43489 2.66962 8.24877 2.77529 7.87653 2.98663L6.15184 3.96587C5.77253 4.18123 5.58287 4.28891 5.51678 4.44515C5.45068 4.6014 5.51987 4.86787 5.65825 5.4008C6.16137 7.3385 4.93972 9.37763 2.98902 9.9036C2.46712 10.0443 2.20617 10.1147 2.10308 10.2492C2 10.3838 2 10.6003 2 11.0332V12.9669C2 13.3998 2 13.6163 2.10308 13.7508C2.20615 13.8854 2.46711 13.9558 2.98902 14.0965C4.9394 14.6225 6.16008 16.6616 5.65672 18.5992C5.51829 19.1321 5.44907 19.3985 5.51516 19.5548C5.58126 19.7111 5.77092 19.8188 6.15025 20.0341L7.87495 21.0134C8.24721 21.2247 8.43334 21.3304 8.6004 21.3079C8.76746 21.2854 8.95588 21.0973 9.33271 20.7213C10.7927 19.2644 13.2088 19.2643 14.6689 20.7212C15.0457 21.0973 15.2341 21.2853 15.4012 21.3078C15.5682 21.3303 15.7544 21.2246 16.1266 21.0133L17.8513 20.034C18.2307 19.8187 18.4204 19.711 18.4864 19.5547C18.5525 19.3984 18.4833 19.132 18.3448 18.5991C17.8412 16.6616 19.0609 14.6226 21.011 14.0965Z\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"1.5\"></path></svg>";
  const patch = () => {
    document.querySelectorAll('.topbar:not([data-app])').forEach((tb) => {
      tb.dataset.app = '1';
      tb.innerHTML = '<nav class="tabs" aria-label="Sections">' + TABS.map(([k, l, h]) => '<a href="' + h + '"' + (k === CUR ? ' aria-current="page"' : '') + '>' + l + '</a>').join('') + '</nav><a class="setbtn" href="settings.html" aria-label="Settings">' + GEAR + '</a>';
    });
    const sub = document.querySelector('.subtop'); const tb = document.querySelector('.topbar');
    if (tb && CUR === 'library') tb.hidden = !!sub;
  };
  new MutationObserver(patch).observe(document.documentElement, { childList: true, subtree: true });
  patch();
  const go = (h) => { location.href = h; };
  document.addEventListener('click', (e) => {
    const t = e.target;
    const href = t.closest('[data-href]'); if (href) { e.preventDefault(); e.stopImmediatePropagation(); return go(href.dataset.href); }
    if (t.closest('[data-goback]')) { e.preventDefault(); e.stopImmediatePropagation(); return history.length > 1 ? history.back() : go('index.html'); }
    if (CUR === 'page' && t.closest('[data-open]')) { e.preventDefault(); e.stopImmediatePropagation(); return go('details.html'); }
    if (CUR === 'details' && t.closest('[data-toast="Back to the Page tab"]')) { e.preventDefault(); e.stopImmediatePropagation(); return go('index.html'); }
    const dt = t.closest('[data-toast]');
    if (dt && /^Opens Details/.test(dt.dataset.toast)) { e.preventDefault(); e.stopImmediatePropagation(); return go('details.html'); }
    if (CUR === 'library' && t.closest('[data-open]') && !t.closest('button')) { e.preventDefault(); e.stopImmediatePropagation(); return go('details.html'); }
  }, true);
})();
</script>
