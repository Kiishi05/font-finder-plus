<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/* Same tokens as the Font Finder Plus side panel: grey page, white cards, ink buttons.
   Figma's dark theme adds the figma-dark class to <html> (themeColors: true). */
:root {
  --bg: #f2f2f2; --card: #ffffff; --ink: #171717; --muted: #525252; --faint: #737373;
  --line: rgba(0, 0, 0, 0.08); --field: #f2f2f2; --field-2: #e5e5e5; --hover: #e5e5e5; --inset: #f8f8f8;
  --green: #19a35a; --green-text: #0b7a37; --green-soft: #e3f6ea;
  --amber: #e39b12; --amber-text: #8a5a00;
  --ui: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --r-card: 18px; --r-inner: 14px; --r-ctl: 11px; --r-field: 13px;
  color-scheme: light;
}
:root.figma-dark {
  --bg: #0d0d0d; --card: #171717; --ink: #f2f2f2; --muted: #a3a3a3; --faint: #8a8a8a;
  --line: rgba(255, 255, 255, 0.08); --field: #262626; --field-2: #333333; --hover: #333333; --inset: #212121;
  --green: #3ad47a; --green-text: #6be29c; --green-soft: rgba(58, 212, 122, 0.14);
  --amber: #e39b12; --amber-text: #f2be6b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
h2 { margin: 0; font: 500 14px/1.3 var(--ui); }
p { margin: 0; }
b { font-weight: 500; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }

#main { height: 100vh; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--card); border-radius: var(--r-card); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card p, .sub { color: var(--faint); font-size: 12.5px; }
.foot { flex: none; padding: 10px; background: var(--bg); border-top: 1px solid var(--line); }

/* Buttons and controls: filled, no strokes */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border: none; border-radius: var(--r-field); background: var(--field); color: var(--ink); font-weight: 500; white-space: nowrap; text-decoration: none; transition: background-color 150ms ease, opacity 150ms ease, transform 160ms var(--ease-out); }
.btn.primary { background: var(--ink); color: var(--card); }
.btn.wide { width: 100%; height: 44px; }
.btn.wide2 { width: 100%; height: 40px; flex: none; }
.scroll > .btn { background: var(--card); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:disabled:active { transform: none; }
@media (hover: hover) and (pointer: fine) {
  .btn:not(.primary):not(:disabled):hover { background: var(--field-2); }
  .scroll > .btn:not(:disabled):hover { background: var(--hover); }
  .btn.primary:not(:disabled):hover { opacity: 0.88; }
}
.link { display: inline-flex; align-items: center; gap: 4px; border: none; background: none; padding: 0; color: var(--muted); font-weight: 500; font-size: 12.5px; }
.link:hover { color: var(--ink); }
.chev { display: inline-flex; transition: transform 200ms var(--ease-out); }
[aria-expanded="true"] > .chev { transform: rotate(180deg); }
.switch { width: 34px; height: 20px; border-radius: 99px; border: none; padding: 0; background: var(--field-2); position: relative; flex: none; transition: background-color 150ms ease; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: transform 160ms var(--ease-out); }
.switch[aria-checked="true"] { background: var(--ink); }
.switch[aria-checked="true"]::after { transform: translateX(14px); }
kbd { font: 500 11px var(--ui); background: var(--card); border-radius: 6px; padding: 2px 6px; color: var(--muted); box-shadow: 0 1px 0 var(--field-2); }

/* Licence badge: green only for free, amber for paid, grey for system, ring for unknown */
.lic { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; flex: none; }
.lic i { width: 6px; height: 6px; border-radius: 50%; }
.lic.free { color: var(--green-text); } .lic.free i { background: var(--green); }
.lic.paid { color: var(--amber-text); } .lic.paid i { background: var(--amber); }
.lic.system { color: var(--muted); } .lic.system i { background: var(--faint); }
.lic.unknown { color: var(--faint); } .lic.unknown i { box-shadow: inset 0 0 0 1.5px var(--faint); }

/* Paste */
.ph { display: flex; flex-direction: column; gap: 4px; }
.ph h2 { font-size: 15px; }
.paste { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 16px; border-radius: 16px; background: var(--field); border: 1.5px dashed var(--field-2); text-align: center; color: var(--ink); width: 100%; transition: border-color 150ms ease; }
@media (hover: hover) and (pointer: fine) { .paste:hover { border-color: var(--faint); } }
.paste:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 16px; }
.paste .pic { color: var(--muted); margin-bottom: 4px; display: inline-flex; }
.paste b { font-size: 14px; }
.paste .faint { color: var(--faint); font-size: 12.5px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--muted); }
.steps b { color: var(--ink); }
.steps .n { width: 20px; height: 20px; border-radius: 50%; background: var(--field); color: var(--ink); font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; flex: none; margin-top: -1px; }
textarea { width: 100%; height: 64px; resize: vertical; border: none; border-radius: var(--r-field); background: var(--inset); color: var(--ink); font: inherit; padding: 10px 12px; outline: none; }
textarea:focus { box-shadow: 0 0 0 2px var(--ink); }
.recheck { gap: 12px; }
.recheck > div { display: flex; flex-direction: column; gap: 2px; }
.note { display: flex; align-items: flex-start; gap: 8px; padding: 4px 8px; font-size: 12px; color: var(--faint); text-align: left; }
.note svg { flex: none; margin-top: 1px; }

/* Fonts */
.sitecard { gap: 12px; }
.sh { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sh b { font-size: 15px; overflow-wrap: anywhere; }
.sh span { font-size: 12px; color: var(--faint); }
.meter { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--green); border-radius: 3px; transform-origin: left; transition: transform 300ms var(--ease-out); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.d { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.d.ok { background: var(--green); } .d.sub { background: var(--field-2); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 4px; background: var(--card); border-radius: 14px; flex: none; }
.seg button { height: 34px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background-color 150ms ease, color 150ms ease; }
.seg button .n { color: var(--faint); font-weight: 400; }
.seg button[aria-selected="true"] { background: var(--field); color: var(--ink); }
.hintline { font-size: 12.5px; color: var(--faint); padding: 2px 8px; }
.fonts { display: flex; flex-direction: column; gap: 8px; }
.fcard { gap: 12px; }
.fmeta { display: flex; align-items: center; gap: 8px; min-width: 0; }
.fmeta b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fmeta .grow { flex: 1; }
.pv { display: block; max-width: 100%; height: 48px; object-fit: contain; object-position: left center; }
:root.figma-dark .pv { filter: invert(1); }
.pv.none { height: auto; font-size: 12px; color: var(--faint); }
.stand { display: flex; align-items: center; gap: 10px; }
.stand .sl { font-size: 12px; color: var(--faint); flex: none; }
.stand .sub { font-size: 12px; }
.dd { position: relative; flex: 1; min-width: 0; }
.dd > button { width: 100%; height: 34px; border: none; border-radius: var(--r-ctl); background: var(--field); display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; color: var(--ink); }
.dd > button > span:first-child { flex: 1; min-width: 0; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dd .pct { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
.dd .chev { color: var(--faint); }
.dd ul { position: absolute; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--card); border-radius: 13px; box-shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(0, 0, 0, 0.14); z-index: 5; max-height: 240px; overflow: auto; animation: ddin 150ms var(--ease-out); transform-origin: top; }
.dd ul.up { top: auto; bottom: calc(100% + 4px); transform-origin: bottom; }
@keyframes ddin { from { opacity: 0; transform: scale(0.97); } }
.dd li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.dd li[aria-disabled="true"] { cursor: default; color: var(--faint); }
.dd li:not([aria-disabled="true"]):hover, .dd li.kb { background: var(--field); }
.dd li span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd li .ni { font-size: 11.5px; color: var(--faint); flex: none; }
.dd li svg, .dd li > i { width: 16px; height: 16px; flex: none; }
.more { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); animation: fadein 200ms var(--ease-out); }
.kv { display: flex; gap: 12px; font-size: 12.5px; }
.kv span { width: 76px; flex: none; color: var(--faint); }
.kv b { font-weight: 400; min-width: 0; overflow-wrap: anywhere; }
.more p { font-size: 12px; }
.btn.getit { align-self: flex-start; margin-top: 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }
.create { gap: 4px; }
.create h2 { margin-bottom: 8px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.create h2 + .opt { border-top: none; }
.oi { width: 32px; height: 32px; border-radius: 10px; background: var(--inset); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.ot { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.ot span { font-size: 12px; color: var(--faint); }
.checking { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); }

/* Creating and done */
.prog { gap: 16px; }
.bar { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 3px; transform-origin: left; transition: transform 400ms var(--ease-out); }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.plist li { display: flex; align-items: center; gap: 10px; color: var(--faint); }
.plist li.done, .plist li.now { color: var(--ink); }
.pi { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.pi > i { width: 6px; height: 6px; border-radius: 50%; background: var(--field-2); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--field-2); border-top-color: var(--ink); animation: spin 800ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.donecard { gap: 16px; }
.dicon { width: 44px; height: 44px; border-radius: 14px; background: var(--green-soft); color: var(--green-text); display: inline-flex; align-items: center; justify-content: center; }
.donecard h2 { font-size: 16px; margin-bottom: 4px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tiles div { background: var(--inset); border-radius: var(--r-inner); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tiles b { font-size: 20px; }
.tiles span { font-size: 12px; color: var(--faint); }

#toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: calc(100% - 32px); width: max-content; background: var(--ink); color: var(--card); padding: 8px 14px; border-radius: 12px; font-size: 12.5px; z-index: 20; animation: toastin 200ms var(--ease-out); text-align: center; }
body.has-foot #toast { bottom: 76px; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="main"></main>
<div id="toast" role="status" hidden></div>
<script>/*__UI_JS__*/</script>
</body>
</html>
