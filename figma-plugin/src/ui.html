<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: var(--figma-color-bg, #fff);
  --bg2: var(--figma-color-bg-secondary, #f5f5f5);
  --ink: var(--figma-color-text, #111);
  --muted: var(--figma-color-text-secondary, #666);
  --line: var(--figma-color-border, #e5e5e5);
  --brand: var(--figma-color-bg-brand, #0d99ff);
  --onbrand: var(--figma-color-text-onbrand, #fff);
  --ok: var(--figma-color-text-success, #14804a);
  --warn: var(--figma-color-text-warning, #a35c00);
  --link: var(--figma-color-text-brand, #0d99ff);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 12px/1.45 Inter, -apple-system, "Segoe UI", system-ui, sans-serif; }
#main { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
b { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 11px; margin: 0; }
.paste { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 16px; border: 1.5px dashed var(--line); border-radius: 12px; background: var(--bg2); text-align: center; cursor: text; }
.paste b { font-size: 14px; }
.paste:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.steps { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
textarea { width: 100%; height: 56px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; padding: 8px; }
.card { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; background: var(--bg2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--onbrand); height: 36px; }
.btn:disabled { opacity: .55; cursor: default; }
.link { all: unset; display: inline-flex; align-items: center; gap: 4px; color: var(--link); cursor: pointer; font-weight: 500; }
.site { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.site > div { display: flex; flex-direction: column; min-width: 0; }
.site b { font-size: 14px; overflow-wrap: anywhere; }
.summary { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--bg2); }
.summary.ok { color: var(--ok); }
.summary.warn { color: var(--warn); }
.summary svg { flex: none; margin-top: 2px; }
.fonts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.font { display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.pv { display: block; max-width: 100%; height: 34px; object-fit: contain; object-position: left center; margin-bottom: 4px; }
:root.figma-dark .pv:not(.none) { filter: invert(1); }
.pv.none { height: auto; font-size: 11px; color: var(--muted); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.name { font-size: 13px; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 3px; flex: none; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--bg2); }
.chip.ok { color: var(--ok); }
.chip.warn { color: var(--warn); }
.lic { font-weight: 500; }
.pick { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.pick span { flex: none; color: var(--muted); }
select { flex: 1; min-width: 0; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.opts { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 10px; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.opts legend { padding: 0 4px; color: var(--muted); }
.opts label { display: flex; gap: 8px; align-items: center; }
#toast { position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 10px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); }
</style>
</head>
<body>
<main id="main"></main>
<div id="toast" role="status" hidden></div>
<script>/*__UI_JS__*/</script>
</body>
</html>
