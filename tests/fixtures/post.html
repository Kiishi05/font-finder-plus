<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Mono&family=Fraunces:opsz@9..144&display=block">
<style>
  body { margin: 0; background: #fff; }
  #post { width: 760px; padding: 40px 48px; background: #fff; color: #111; }
  h1 { font: 700 46px/1.1 Inter, sans-serif; margin: 0 0 70px; }
  .row { font-size: 40px; line-height: 1.1; margin: 0 0 70px; }
  .mono { font-family: 'Space Mono', monospace; }
  .serif { font-family: Fraunces, serif; }
  .inter { font-family: Inter, sans-serif; }
  p { font: 400 18px/1.4 Inter, sans-serif; margin: 0; }
</style></head>
<body>
<div id="post">
  <h1>4 fonts you should try</h1>
  <div class="row mono">Space Mono</div>
  <div class="row serif">Fraunces</div>
  <div class="row inter">Clash Display</div>
  <p>Free for personal and commercial use.</p>
</div>
</body></html>
