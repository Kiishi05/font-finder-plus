<!doctype html>
<html><head><meta charset="utf-8">
<!-- Like a "the only fonts I need" post: two columns of names, each set in its own font. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Fraunces:opsz@9..144&family=Instrument+Serif&family=Oswald:wght@600&family=Lobster&family=Space+Mono&display=block">
<style>
  @font-face { font-family: 'Geist Mono'; src: url(fonts/GeistMono.woff2); }
  body { margin: 0; background: #fff; }
  #list { width: 720px; padding: 48px 56px; background: #f4f4f5; color: #111; display: grid; grid-template-columns: 300px 300px; row-gap: 26px; column-gap: 60px; font-size: 36px; line-height: 1.15; }
  .wide { grid-column: 1 / 3; }
</style></head>
<body>
<div id="list">
  <div style="font-family: Inter">Inter</div>
  <div style="font-family: Inter; font-weight: 700">Coolvetica</div>
  <div style="font-family: Fraunces">Fraunces</div>
  <div style="font-family: 'Geist Mono'">Geist Mono</div>
  <div style="font-family: 'Space Mono'">Space Mono</div>
  <div style="font-family: Lobster">Lobster</div>
  <div class="wide"><span style="font-family: 'Instrument Serif'">Instrument Serif</span> <span style="font-family: Oswald; font-weight: 600">Tusker Grotesk</span></div>
</div>
</body></html>
